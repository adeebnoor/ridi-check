<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RIDI Update Check</title>
<style>
/* One working column: a ledger of case states with a one-cell-per-case strip, then change against
   re-run variation on one scale, then the cases to review. No network: fonts are the reader's own. */
:root {
  --bg: #F2F5F7; --surface: #FFFFFF; --ink: #15212B; --muted: #566876; --line: #D3DCE3;
  --accent: #0C5FA8; --accent-ink: #FFFFFF;
  --reg: #B3362B; --reg-bg: #FBE9E6; --imp: #1C774A; --imp-bg: #E2F3EA;
  --uns: #8F5E00; --uns-bg: #FBEFD3; --wrong: #5F4F8C; --wrong-bg: #ECE8F5;
  --ok: #8FA3B1; --ok-bg: #E7EDF1; --inc: #4B5A66; --inc-bg: #E1E6EA;
  --text: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", "Noto Sans", "Noto Sans Arabic", Tahoma, sans-serif;
  --data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Noto Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151B; --surface: #17212A; --ink: #E4ECF2; --muted: #94A5B3; --line: #2C3A46;
    --accent: #6DB3F2; --accent-ink: #08131C;
    --reg: #F08A7E; --reg-bg: #3A1C19; --imp: #6FD19B; --imp-bg: #15301F;
    --uns: #E9B955; --uns-bg: #36290E; --wrong: #B5A6E0; --wrong-bg: #262038;
    --ok: #50626F; --ok-bg: #1D2831; --inc: #A9B6C0; --inc-bg: #25313B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151B; --surface: #17212A; --ink: #E4ECF2; --muted: #94A5B3; --line: #2C3A46;
  --accent: #6DB3F2; --accent-ink: #08131C;
  --reg: #F08A7E; --reg-bg: #3A1C19; --imp: #6FD19B; --imp-bg: #15301F;
  --uns: #E9B955; --uns-bg: #36290E; --wrong: #B5A6E0; --wrong-bg: #262038;
  --ok: #50626F; --ok-bg: #1D2831; --inc: #A9B6C0; --inc-bg: #25313B; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--text); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 940px; margin-inline: auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 1.05rem; font-weight: 600; text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
.num { font-family: var(--data); font-variant-numeric: tabular-nums; }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-start; justify-content: space-between; }
header.top .lead { max-width: 62ch; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 7px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
/* The language button shows the name of the other language. When that name is Arabic, its own stack names
   the Arabic fonts that systems ship; with none of them the browser still uses any font that has the letters. */
#lang[lang="ar"] { font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, "Noto Sans Arabic", "Noto Naskh Arabic", "Geeza Pro", Arial, sans-serif; }
button:focus-visible, textarea:focus-visible, summary:focus-visible, .cell:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
textarea { font-family: var(--data); font-size: 0.82rem; width: 100%; min-height: 110px; padding: 10px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; resize: vertical; }
code { font-family: var(--data); font-size: 0.86em; background: var(--ok-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.note { border-inline-start: 3px solid var(--line); padding-inline-start: 12px; display: flex; flex-direction: column; gap: 4px; overflow-wrap: anywhere; }
main { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
section { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ledger { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0; border: 1px solid var(--line);
  border-radius: 8px; background: var(--surface); overflow: hidden; }
.tile { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; border-inline-end: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; min-width: 0; }
.tile .n { font-family: var(--data); font-variant-numeric: tabular-nums; font-size: 2rem; font-weight: 500; line-height: 1.1; }
.tile .k { font-weight: 600; display: flex; align-items: center; gap: 7px; }
.dot { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.s-reg { --c: var(--reg); --cb: var(--reg-bg); } .s-imp { --c: var(--imp); --cb: var(--imp-bg); }
.s-uns { --c: var(--uns); --cb: var(--uns-bg); } .s-wrong { --c: var(--wrong); --cb: var(--wrong-bg); }
.s-ok { --c: var(--ok); --cb: var(--ok-bg); } .s-chg { --c: var(--accent); --cb: var(--ok-bg); }
.s-inc { --c: var(--inc); --cb: var(--inc-bg); }
.dot, .cell { background: var(--c); }
.tile .n { color: var(--c); } .tile.s-ok .n { color: var(--muted); }
.strip { display: flex; flex-wrap: wrap; gap: 3px; }
.cell { width: 18px; height: 18px; border-radius: 3px; border: 0; padding: 0; cursor: default; }
button.cell { cursor: pointer; } button.cell:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
.cell.open { opacity: 0.55; }
.bar { display: flex; height: 18px; border-radius: 4px; overflow: hidden; gap: 2px; }
.bar .seg { background: var(--c); min-width: 3px; }
.more { margin-top: 4px; }
.bars { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 10px 12px; align-items: center; }
.bars .track { height: 14px; background: var(--ok-bg); border-radius: 3px; position: relative; min-width: 40px; }
.bars .fill { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 3px; background: var(--ok); min-width: 2px; }
.bars .fill.main { background: var(--accent); }
.bars .lab { min-width: 0; }
.panel { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { padding: 4px 10px; font-size: 0.88rem; }
.cards { display: flex; flex-direction: column; gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 12px;
  border-top: 3px solid var(--c); scroll-margin-top: 16px; }
.card[hidden] { display: none; }
.card .head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; }
.pill { font-size: 0.8rem; font-weight: 600; color: var(--c); background: var(--cb); border-radius: 4px; padding: 2px 8px; }
.card .q { font-weight: 500; overflow-wrap: anywhere; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.side { background: var(--bg); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.side .lbl { font-size: 0.76rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
[dir="rtl"] .side .lbl { letter-spacing: 0; }
.side .ver { font-size: 0.8rem; color: var(--muted); overflow-wrap: anywhere; }
.side .ans { font-family: var(--data); font-size: 0.92rem; overflow-wrap: anywhere; white-space: pre-wrap; max-height: 18em; overflow-y: auto; }
.side .rerun { font-size: 0.82rem; color: var(--muted); overflow-wrap: anywhere; }
.side .rerun.diff { color: var(--uns); }
.score { font-size: 0.72rem; border: 1px solid var(--line); color: var(--muted); border-radius: 3px; padding: 0 4px; white-space: nowrap; align-self: flex-start; }
.errs { font-size: 0.84rem; color: var(--muted); overflow-wrap: anywhere; }
details.ctx > summary { cursor: pointer; font-size: 0.9rem; font-weight: 500; }
.ctxgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; padding-top: 10px; }
.ctxgrid ul { margin: 0; padding-inline-start: 16px; font-size: 0.84rem; display: flex; flex-direction: column; gap: 3px; }
.ctxgrid li { overflow-wrap: anywhere; }
.tag { font-size: 0.72rem; border: 1px solid var(--wrong); color: var(--wrong); border-radius: 3px; padding: 0 4px; }
.judge { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.judge button { padding: 4px 10px; font-size: 0.88rem; }
details.wrongs > summary { cursor: pointer; font-weight: 500; }
details.wrongs ul { margin: 10px 0 0; padding-inline-start: 18px; font-size: 0.9rem; display: flex; flex-direction: column; gap: 4px; }
details.wrongs li { overflow-wrap: anywhere; }
.cross { overflow-x: auto; }
.cross table { border-collapse: collapse; font-size: 0.9rem; min-width: 100%; }
.cross th, .cross td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: end; vertical-align: bottom; }
.cross th { font-weight: 500; color: var(--muted); font-size: 0.82rem; }
.cross th[scope="row"], .cross thead th:first-child { text-align: start; }
.cross th[scope="row"] { color: var(--ink); font-size: 0.9rem; white-space: nowrap; }
.cross td { font-family: var(--data); font-variant-numeric: tabular-nums; }
.cross .dot { display: inline-block; margin-inline-end: 7px; }
.cross td.zero { color: var(--muted); opacity: 0.6; }
.cross tr:last-child th, .cross tr:last-child td { border-bottom: 0; }
.limits ul { margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 6px; max-width: 70ch; }
.out { display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 520px) { .bars { grid-template-columns: minmax(0, 1fr); gap: 4px 0; } .bars .val { margin-bottom: 8px; } h1 { font-size: 1.35rem; } }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
@media print { button, .filters, .out { display: none !important; } body { background: #fff; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="lead">
      <h1 id="t-name">RIDI Update Check</h1>
      <p class="muted" id="t-tagline"></p>
    </div>
    <button type="button" id="lang" lang="ar">العربية</button>
  </header>
  <div class="small muted note" id="source-note"></div>
  <main id="report"></main>
  <section class="limits">
    <h2 id="t-limits"></h2>
    <ul class="muted" id="t-limit-list"></ul>
  </section>
</div>
<noscript><p style="padding:16px">This report needs JavaScript to draw. The same numbers are in summary.json and review_cases.csv.</p></noscript>
<script id="ridi-data" type="application/json">__RIDI_DATA__</script>
<script>
/* All analysis is done by `ridi-check report`. This script only draws what is in the data block. */
const D = JSON.parse(document.getElementById("ridi-data").textContent);
const M = D.meta, S = D.summary, KEY = M.mode === "key";
const PAGE = 50, STRIP_MAX = 2000, LIST_MAX = 500;
const state = { lang: "en", filter: "all", shown: PAGE, judge: Object.assign({}, D.judgments) };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
(function () {
  const saved = store.get("ridi-lang");
  if (saved === "ar" || saved === "en") state.lang = saved;
  else if (M.lang) state.lang = M.lang;
  else if ((navigator.language || "").toLowerCase().startsWith("ar")) state.lang = "ar";
  const j = store.get("ridi-judge-" + M.report_id);
  if (j) { try { Object.assign(state.judge, JSON.parse(j)); } catch (e) {} }
})();

const $ = (id) => document.getElementById(id);
const L = () => D.strings[state.lang];
const t = (k, v) => { let s = L()[k]; if (v) for (const key in v) s = s.split("{" + key + "}").join(v[key]); return s; };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (k, n) => (n ? (100 * k / n) : 0);
const fmt = (x) => (Math.round(x * 10) / 10).toFixed(1).replace(/\.0$/, "");
const by = (s) => S.states[s] || 0;

const CLS = D.classes;
const JUDGMENTS = ["worse", "better", "same_meaning", "unsure"];
const pillText = (c) => c.flag ? L().pill[c.state + (c.flag === "stable" ? "_changed" : c.flag === "varied" ? "_varied" : "_changed_unconfirmed")] : L().pill[c.state];
const isStable = (c) => c.state.indexOf("stable_") === 0 || c.flag === "stable";

function tile(s, sub) {
  return '<div class="tile ' + CLS[s] + '"><span class="n">' + by(s) + '</span><span class="k"><span class="dot"></span>' + esc(L().state[s]) +
    '</span><span class="small muted">' + esc(sub) + "</span></div>";
}
function sideHTML(label, version, runs) {
  let h = '<div class="side"><span class="lbl">' + esc(label) + "</span>";
  if (version) h += '<span class="ver" dir="auto">' + esc(version) + "</span>";
  if (!runs.length) return h + "</div>";
  const r = runs[0];
  h += '<span class="ans" dir="auto">' + esc(r.ans || (r.cor === 1 ? "1" : r.cor === 0 ? "0" : "")) + "</span>";
  if (KEY && r.ans && r.cor != null) h += '<span class="score">' + esc(t(r.cor ? "scored1" : "scored0")) + "</span>";
  runs.slice(1).forEach((x, i) => {
    h += x.same ? '<span class="rerun">' + esc(t("runSame", { k: i + 2 })) + "</span>"
      : '<span class="rerun diff">' + esc(t("runDiff", { k: i + 2 })) + '<span class="num" dir="auto">' + esc(x.ans || String(x.cor)) + "</span>" +
        (KEY && x.ans && x.cor != null ? ' <span class="score">' + esc(t(x.cor ? "scored1" : "scored0")) + "</span>" : "") + "</span>";
  });
  return h + "</div>";
}
function ctxHTML(c, i) {
  const moved = c.mov || [];
  if (!c.rem.length && !c.add.length && !moved.length) return c.ord ? '<p class="small muted">' + esc(t("ctxOrder")) + "</p>" : "";
  const li = (x) => '<li><span dir="auto">' + esc(x) + "</span></li>";
  const num = (x) => String(Math.round(x * 1000) / 1000);
  /* a passage that both versions retrieved: where it stood, what it scored, whether its content is the same */
  const what = (m) => [m[1] !== m[2] ? t("ctxRank", { a: m[1], b: m[2] }) : "", m[3] !== null && m[4] !== null && m[3] !== m[4] ? t("ctxScore", { a: num(m[3]), b: num(m[4]) }) : "",
    m[5] ? t("ctxContent") : ""].filter(Boolean).join("; ");
  return '<details class="ctx" data-k="ctx-' + i + '"><summary>' + esc(t("ctx", { n: c.rem.length + c.add.length + moved.length })) + '</summary><div class="ctxgrid"><div><p class="small muted">' +
    esc(t("removed")) + "</p><ul>" + c.rem.map(li).join("") + '</ul></div><div><p class="small muted">' + esc(t("added")) + "</p><ul>" + c.add.map(li).join("") + "</ul></div></div>" +
    (moved.length ? '<p class="small muted" style="padding-top:10px">' + esc(t("ctxMoved")) + "</p><ul>" + moved.map((m) => '<li><span dir="auto">' + esc(m[0]) + '</span> <span class="small muted">' +
      esc(what(m)) + "</span></li>").join("") + "</ul>" : "") +
    '<p class="small muted" style="padding-top:10px">' + esc(t("kept", { n: c.kept })) + " " + esc(t("ctxNote")) + "</p></details>";
}
function cardHTML(c, i) {
  let h = '<article class="card ' + CLS[c.state] + '" id="c-' + i + '" data-i="' + i + '"><div class="head"><span class="pill">' + esc(pillText(c)) +
    '</span><span class="small muted">' + esc(t("caseN", { id: "" })) + '<span class="num" dir="auto">' + esc(c.id) + "</span></span></div>";
  if (c.q) h += '<p class="q" dir="auto">' + esc(c.q) + "</p>";
  if (c.state === "correct_both") h += '<p class="small muted">' + esc(t("correctChangedNote")) + "</p>";
  if (KEY && c.expected) h += '<p class="small muted">' + esc(t("expected")) + '<span class="num" dir="auto">' + esc(c.expected) + "</span></p>";
  h += '<div class="pair">' + sideHTML(t("current"), M.labels.current, c.b) + sideHTML(t("proposed"), M.labels.proposed, c.u) + "</div>";
  if (c.err) h += '<p class="errs">' + esc(t("runErrors")) + '<span class="num" dir="ltr">' + esc(c.err) + "</span></p>";
  h += ctxHTML(c, i);
  if (!KEY && c.state === "stable_change") {
    h += '<div class="judge"><span class="small muted">' + esc(t("yourCall")) + "</span>" + JUDGMENTS.map((k) =>
      '<button type="button" data-judge="' + k + '" data-i="' + i + '" aria-pressed="' + (state.judge[c.id] === k) + '">' + esc(t(k)) + "</button>").join("") + "</div>";
  }
  return h + "</article>";
}
function judgedText() {
  const cnt = (k) => D.stable_change_ids.filter((id) => state.judge[id] === k).length;
  const w = cnt("worse"), b = cnt("better"), s = cnt("same_meaning");
  return t("judged", { w, b, s, u: D.stable_change_ids.length - w - b - s });
}
/* Cards are drawn a page at a time, so a report with thousands of cases to review opens at once. */
function matching() {
  const out = [];
  D.cards.forEach((c, i) => { if (state.filter === "all" || (state.filter === "uns" ? c.state === "unstable" || c.flag === "varied" : isStable(c))) out.push(i); });
  return out;
}
function applyFilter() {
  const open = Array.from(document.querySelectorAll("#cards details[open][data-k]")).map((d) => d.dataset.k);
  const all = matching(), part = all.slice(0, state.shown);
  let h = part.map((i) => cardHTML(D.cards[i], i)).join("");
  if (!all.length) h += '<p class="muted" id="empty">' + esc(D.cards.length ? t("noneView") : t("none")) + "</p>";
  if (all.length > part.length) {
    h += '<div class="row more"><span class="small muted" id="shown-of">' + esc(t("shownOf", { a: part.length, b: all.length })) + '</span><button type="button" id="more">' +
      esc(t("showMore", { n: Math.min(PAGE, all.length - part.length) })) + '</button><button type="button" id="show-all">' + esc(t("showAll", { n: all.length })) + "</button></div>";
  }
  $("cards").innerHTML = h;
  open.forEach((k) => { const d = Array.from(document.querySelectorAll("#cards details[data-k]")).find((x) => x.dataset.k === k); if (d) d.open = true; });
  document.querySelectorAll("[data-filter]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.filter === state.filter));
}
/* Above STRIP_MAX cases one cell per case is too many to draw or to read: one bar shows each state's share. */
function stripHTML() {
  if (D.strip.length > STRIP_MAX) {
    const counts = D.summary.states, n = D.strip.length;
    return '<div class="bar" role="img" aria-label="' + esc(t("stripBar", { max: STRIP_MAX, n })) + '">' + Object.keys(counts).filter((s) => counts[s]).map((s) =>
      '<span class="seg ' + CLS[s] + '" style="flex-grow:' + counts[s] + '" title="' + esc(L().state[s] + ": " + counts[s]) + '"></span>').join("") +
      '</div><p class="small muted">' + esc(t("stripBar", { max: STRIP_MAX, n })) + "</p>";
  }
  return '<div class="strip" role="list">' + D.strip.map((x) => {
    const id = x[0], s = x[1], card = x[2];
    const label = esc(t("caseN", { id }) + ": " + (card >= 0 ? pillText(D.cards[card]) : L().state[s]));
    return card >= 0
      ? '<button type="button" class="cell ' + CLS[s] + '" role="listitem" data-go="' + card + '" title="' + label + '" aria-label="' + label + '"></button>'
      : '<span class="cell open ' + CLS[s] + '" role="listitem" title="' + label + '"></span>';
  }).join("") + '</div><p class="small muted">' + esc(t("stripNote")) + "</p>";
}
/* Answer-key mode: what the score did (rows) against what the answer text did (columns), in cases. */
function crossHTML() {
  const T = D.summary.score_and_answer_text, mixed = D.summary.same_text_scored_differently || [], C = D.summary.score_check;
  if (!T && !mixed.length && !C) return "";
  let h = "<section><h2>" + esc(t("crossTitle")) + '</h2><div class="panel">';
  if (T) {
    const rows = Object.keys(T), cols = Object.keys(L().answerCol).filter((c) => c !== "no_answer_text" || rows.some((r) => T[r][c]));
    h += '<div class="cross"><table><thead><tr><th scope="col">' + esc(t("crossHead")) + "</th>" + cols.map((c) => '<th scope="col">' + esc(L().answerCol[c]) + "</th>").join("") +
      "</tr></thead><tbody>" + rows.map((r) => '<tr><th scope="row"><span class="dot ' + CLS[r] + '"></span>' + esc(L().state[r]) + "</th>" +
        cols.map((c) => '<td class="' + (T[r][c] ? "" : "zero") + '">' + T[r][c] + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>" +
      '<p class="small muted">' + esc(t("crossNote")) + "</p>";
  }
  if (mixed.length) h += '<p class="small" style="color:var(--uns)">' + esc(t("sameTextScored", { n: mixed.length, ids: mixed.slice(0, 20).join(", ") + (mixed.length > 20 ? ", …" : "") })) + "</p>";
  if (C) { const ids = C.cases_that_disagree, skipped = C.cases_without_expected || C.runs_without_answer_text;   /* written by report --check-scores */
    h += '<p class="small"' + (C.runs_that_disagree ? ' style="color:var(--uns)"' : "") + ">" + esc((C.runs_that_disagree
      ? t("scoreCheckBad", { scorer: C.scorer, d: C.runs_that_disagree, n: C.runs_checked, c: ids.length, ids: ids.slice(0, 20).join(", ") + (ids.length > 20 ? ", …" : "") })
      : t("scoreCheckOk", { scorer: C.scorer, n: C.runs_checked })) + (skipped ? t("scoreCheckSkipped", { e: C.cases_without_expected, a: C.runs_without_answer_text }) : "")) + "</p>"; }
  return h + "</div></section>";
}
function render() {
  const open = Array.from(document.querySelectorAll("details[open][data-k]")).map((d) => d.dataset.k);
  const app = $("app");
  document.documentElement.lang = state.lang; document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
  app.dir = state.lang === "ar" ? "rtl" : "ltr";
  document.title = t("name");
  $("t-name").textContent = t("name"); $("lang").textContent = t("langBtn"); $("lang").lang = state.lang === "ar" ? "en" : "ar"; $("t-tagline").textContent = t("tagline");
  $("t-limits").textContent = t("limits"); $("t-limit-list").innerHTML = L().limitList.map((x) => "<li>" + esc(x) + "</li>").join("");
  let note = "<span>" + esc(t(M.n === 1 ? "sourceOne" : "source", { n: M.n, file: M.file, when: M.generated, version: M.tool_version })) + "</span>";
  if (M.labels.current || M.labels.proposed) note += '<span dir="auto">' + esc(t("versions", { a: M.labels.current || "—", b: M.labels.proposed || "—" })) + "</span>";
  note += "<span>" + esc(KEY ? t("modeNote") : t("modeNote", { rule: M.threshold >= 1 ? t("simExact") : t("simWords", { p: fmt(M.threshold * 100) }) })) + "</span>";
  $("source-note").innerHTML = note;

  let h = "";
  /* ledger */
  h += "<section><h2>" + esc(t("ledger")) + '</h2><div class="ledger">';
  h += D.tiles.map((s) => tile(s, L().sub[s] || t("unconfSub"))).join("");
  h += "</div>" + stripHTML();
  h += '<p class="small muted">' + esc(t("stableNote", { b: S.runs_per_version.current, u: S.runs_per_version.proposed })) + "</p>";
  if (!KEY && D.stable_change_ids.length) h += '<p class="small" id="judged">' + esc(judgedText()) + "</p>";
  h += "</section>";
  /* rates */
  const F = S.first_run, ch = F.change_between_versions, rb = F.rerun_variation_current, ru = F.rerun_variation_proposed;
  const pT = pct(ch.count, ch.n), pB = rb ? pct(rb.count, rb.n) : null, pU = ru ? pct(ru.count, ru.n) : null;
  const top = Math.max(5, Math.ceil(Math.max(pT, pB || 0, pU || 0) / 5) * 5);
  /* The Wilson score interval, 95%: it treats the cases as a random sample. Nothing is decided by it. */
  const wilson = (k, n) => { const z = 1.959964, q = k / n, d = 1 + z * z / n, c = (q + z * z / (2 * n)) / d,
    w = z * Math.sqrt(q * (1 - q) / n + z * z / (4 * n * n)) / d; return { a: fmt(100 * Math.max(0, c - w)), b: fmt(100 * Math.min(1, c + w)) }; };
  const bar = (label, p, k, m, main) => '<span class="lab">' + esc(label) + '</span><span class="track"><span class="fill' + (main ? " main" : "") + '" style="width:' + (100 * p / top) +
    '%"></span></span><span class="val num">' + fmt(p) + '% <span class="muted">(' + esc(t("of", { k, n: m }) + t("interval95", wilson(k, m))) + ")</span></span>";
  h += "<section><h2>" + esc(t("rates")) + '</h2><div class="panel"><div class="bars">' + bar(t("barMain"), pT, ch.count, ch.n, true);
  if (pB !== null) h += bar(t("barB"), pB, rb.count, rb.n, false);
  if (pU !== null) h += bar(t("barU"), pU, ru.count, ru.n, false);
  h += '</div><p class="small muted">' + esc(t("intervalNote")) + "</p><p>";
  if (pB === null || pU === null) h += esc(t("rateNone"));
  else if (pT <= Math.max(pB, pU)) h += esc(t("rateWithin"));
  else h += esc(t("rateAbove", { t: fmt(pT), b: fmt(pB), u: fmt(pU) }));
  h += "</p>";
  if (D.acc) { const d = pct(D.acc.b, D.acc.n) - pct(D.acc.a, D.acc.n);
    h += '<p class="small muted">' + esc(t("acc", { a: fmt(pct(D.acc.a, D.acc.n)), b: fmt(pct(D.acc.b, D.acc.n)), d: (d > 0 ? "+" : d < 0 ? "−" : "") + fmt(Math.abs(d)), r: D.acc.r, i: D.acc.i })) + "</p>";
    if (D.acc.n >= 3 && !D.acc.a && !D.acc.b) h += '<p class="small" style="color:var(--uns)">' + esc(t("noneCorrect")) + "</p>";
    const c = 2 * Math.min(D.acc.r, D.acc.i);
    if (c) h += '<p class="small muted">' + esc(t("masked", { m: D.acc.r + D.acc.i, v: Math.abs(D.acc.i - D.acc.r), c })) + "</p>"; }
  if (D.summary.passages) { const P = D.summary.passages, F = P.by_state[D.focus];
    h += '<p class="small muted">' + esc((P.differ === P.cases_with_passages && P.cases_with_passages > 1 ? t("passagesAll", { n: P.cases_with_passages })
        : !P.differ ? t(P.cases_with_passages === 1 ? "passagesNoneOne" : "passagesNone", { n: P.cases_with_passages })
        : t("passages", { k: P.differ, n: P.cases_with_passages }) + (F ? t("passagesFocus", { k: F.differ, n: F.n }) : "") + t("passagesNote")) + (P.reordered ? t("passagesOrder", { r: P.reordered }) : "") + (P.content_changed ? t("passagesContent", { r: P.content_changed }) : "")) + "</p>"; }
  if ((D.summary.differ_only_in_letter_case || []).length) { const ids = D.summary.differ_only_in_letter_case;
    h += '<p class="small muted">' + esc(t("caseOnly", { n: ids.length, ids: ids.slice(0, 20).join(", ") + (ids.length > 20 ? ", …" : "") })) + "</p>"; }
  if ((D.summary.labelled_by_similarity || []).length) { const ids = D.summary.labelled_by_similarity;
    h += '<p class="small muted">' + esc(t("bySimilarity", { n: ids.length, ids: ids.slice(0, 20).join(", ") + (ids.length > 20 ? ", …" : "") })) + "</p>"; }
  h += '<p class="small muted">' + esc(t("rateFirst")) + (Math.max(S.runs_per_version.current, S.runs_per_version.proposed) > 2
    ? " " + esc(t("anyRun", { b: S.any_run_disagreement.current, u: S.any_run_disagreement.proposed })) : "") + "</p>";
  h += "</div></section>";
  h += crossHTML();
  /* review */
  h += "<section><h2>" + esc(t("review")) + ' <span class="num muted">' + D.cards.length + '</span></h2><div class="filters">' +
    [["all", "fAll"], ["stable", "fStable"], ["uns", "fUns"]].map((f) => '<button type="button" data-filter="' + f[0] + '">' + esc(t(f[1])) + "</button>").join("") +
    '</div><div class="cards" id="cards"></div>';
  if (KEY && D.wrong.length) {
    const flagged = D.wrong.filter((w) => w[2]).length;
    h += '<details class="wrongs panel" data-k="wrongs"><summary>' + esc(t("wrongList", { n: D.wrong.length })) + '</summary><p class="small muted" style="padding-top:8px">' + esc(t("wrongNote")) +
      (flagged ? " " + esc(t("wrongChanged", { n: flagged })) : "") + (D.wrong.length > LIST_MAX ? " " + esc(t("wrongMore", { a: LIST_MAX, n: D.wrong.length })) : "") + "</p><ul>" + D.wrong.slice(0, LIST_MAX).map((w) => '<li><span class="num muted">' + esc(w[0]) + '</span> <span dir="auto">' + esc(w[1]) + "</span>" +
      (w[2] ? ' <span class="tag">' + esc(L().pill["wrong_both" + (w[2] === "stable" ? "_changed" : w[2] === "varied" ? "_varied" : "_changed_unconfirmed")]) + "</span>" : "") + "</li>").join("") + "</ul></details>";
  }
  if (!KEY && D.stable_change_ids.length) {
    h += '<div class="out"><div class="row"><button type="button" id="export">' + esc(t("export")) + '</button><span class="small muted" id="export-msg" role="status"></span></div>' +
      '<p class="small muted">' + esc(t("exportHow")) + '</p><textarea id="csv-out" hidden readonly dir="ltr"></textarea></div>';
  }
  h += "</section>";
  $("report").innerHTML = h;
  open.forEach((k) => { const d = document.querySelector('details[data-k="' + k + '"]'); if (d) d.open = true; });
  applyFilter();
}
function judgmentsCSV() {
  const q = (s) => '"' + String(s).replace(/"/g, '""') + '"';
  return ["case_id,judgment"].concat(D.stable_change_ids.filter((id) => state.judge[id]).map((id) => q(id) + "," + state.judge[id])).join("\n") + "\n";
}

$("lang").addEventListener("click", () => { state.lang = state.lang === "ar" ? "en" : "ar"; store.set("ridi-lang", state.lang); render(); });
$("report").addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.filter) { state.filter = b.dataset.filter; state.shown = PAGE; applyFilter(); }
  else if (b.id === "more") { state.shown += PAGE; applyFilter(); }
  else if (b.id === "show-all") { state.shown = Infinity; applyFilter(); }
  else if (b.dataset.judge) {
    /* Updated in place, so open passage lists and the scroll position stay as they are. */
    const id = D.cards[+b.dataset.i].id;
    if (state.judge[id] === b.dataset.judge) delete state.judge[id]; else state.judge[id] = b.dataset.judge;
    store.set("ridi-judge-" + M.report_id, JSON.stringify(state.judge));
    b.parentElement.querySelectorAll("[data-judge]").forEach((x) => x.setAttribute("aria-pressed", state.judge[id] === x.dataset.judge));
    const line = $("judged"); if (line) line.textContent = judgedText();
  }
  else if (b.dataset.go) {   /* the card may be on a page that is not drawn yet */
    if (state.filter !== "all" || +b.dataset.go >= state.shown) { state.filter = "all"; state.shown = Math.max(state.shown, +b.dataset.go + 1); applyFilter(); }
    const el = $("c-" + b.dataset.go); if (el) el.scrollIntoView({ block: "start" });
  }
  else if (b.id === "export") {
    const txt = judgmentsCSV(), msg = $("export-msg"), out = $("csv-out");
    try {
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type: "text/csv" })); a.download = "judgments.csv";
      document.body.appendChild(a); a.click(); a.remove(); msg.textContent = "judgments.csv";
    } catch (e) { msg.textContent = t("exportFail"); }
    out.hidden = false; out.value = txt;
  }
});
render();
</script>
</body>
</html>
