name: tests
on: [push, pull_request]
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # anthropic is needed only by the test of examples/adapters/anthropic_adapter.py
      - run: pip install ".[test]" anthropic
      - run: pytest -q
      - name: coverage must not fall below the measured floor
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        # Statements and branches of the installed package. Raise the floor when coverage rises; do not
        # lower it to make a change pass.
        run: pytest -q --cov=ridi_check --cov-branch --cov-report=term-missing --cov-fail-under=95
      - name: security scan of the source and the dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          pip install bandit pip-audit
          # Lists every finding, low severity included, without failing.
          bandit -r src --exit-zero
          # Fails on a finding of medium or high severity that is not explained in the code.
          bandit -r src --severity-level medium --quiet
          # Fails on a known vulnerability in what the package needs to run.
          pip-audit .
          # The test environment is reported, not enforced: a problem in a test tool is not one in the package.
          pip-audit --skip-editable || echo "::warning::pip-audit found a known vulnerability in the test environment"
      - run: ridi-check demo
      - name: the gate allows what its limit allows and stops what it does not
        shell: bash
        run: |
          ridi-check gate ridi-demo/ridi-out/results.csv --max-stable-regressions 4
          if ridi-check gate ridi-demo/ridi-out/results.csv; then echo "the gate should have exited 1"; exit 1; fi
