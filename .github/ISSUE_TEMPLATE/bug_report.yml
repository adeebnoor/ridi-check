name: Bug report
description: Something does not work as the documentation says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Please use synthetic data: do not paste real user questions, real answers or keys.
        For a security problem, do not use this form. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got instead.
      placeholder: "I ran `ridi-check report results.csv` and expected ... but ..."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The exact command, and the smallest results.csv or questions file that shows the problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or error message
      render: text
  - type: input
    id: version
    attributes:
      label: ridi-check version
      description: The output of `ridi-check --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
      placeholder: "Python 3.12, Windows 11"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen
      options:
        - Command line (run, report, gate, demo, init)
        - The HTML report
        - The browser version in web/
        - An adapter (python, command, http)
        - Documentation
    validations:
      required: true
