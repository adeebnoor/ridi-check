<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--page-->
<title>RIDI Update Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One working column: a ledger of case states with a one-cell-per-case strip, then change against
   re-run variation on one scale, then the cases to review. No network: fonts are the reader's own. */
:root {
  --bg: #F2F5F7; --surface: #FFFFFF; --ink: #15212B; --muted: #566876; --line: #D3DCE3;
  --accent: #0C5FA8; --accent-ink: #FFFFFF;
  --reg: #B3362B; --reg-bg: #FBE9E6; --imp: #1C774A; --imp-bg: #E2F3EA;
  --uns: #8F5E00; --uns-bg: #FBEFD3; --wrong: #5F4F8C; --wrong-bg: #ECE8F5;
  --ok: #8FA3B1; --ok-bg: #E7EDF1; --inc: #4B5A66; --inc-bg: #E1E6EA;
  --text: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", "Noto Sans", "Noto Sans Arabic", Tahoma, sans-serif;
  --data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Noto Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151B; --surface: #17212A; --ink: #E4ECF2; --muted: #94A5B3; --line: #2C3A46;
    --accent: #6DB3F2; --accent-ink: #08131C;
    --reg: #F08A7E; --reg-bg: #3A1C19; --imp: #6FD19B; --imp-bg: #15301F;
    --uns: #E9B955; --uns-bg: #36290E; --wrong: #B5A6E0; --wrong-bg: #262038;
    --ok: #50626F; --ok-bg: #1D2831; --inc: #A9B6C0; --inc-bg: #25313B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151B; --surface: #17212A; --ink: #E4ECF2; --muted: #94A5B3; --line: #2C3A46;
  --accent: #6DB3F2; --accent-ink: #08131C;
  --reg: #F08A7E; --reg-bg: #3A1C19; --imp: #6FD19B; --imp-bg: #15301F;
  --uns: #E9B955; --uns-bg: #36290E; --wrong: #B5A6E0; --wrong-bg: #262038;
  --ok: #50626F; --ok-bg: #1D2831; --inc: #A9B6C0; --inc-bg: #25313B; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--text); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 940px; margin-inline: auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 1.05rem; font-weight: 600; text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
.num { font-family: var(--data); font-variant-numeric: tabular-nums; }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-start; justify-content: space-between; }
header.top .lead { max-width: 62ch; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 7px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
/* The language button shows the name of the other language. When that name is Arabic, its own stack names
   the Arabic fonts that systems ship; with none of them the browser still uses any font that has the letters. */
#lang[lang="ar"] { font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, "Noto Sans Arabic", "Noto Naskh Arabic", "Geeza Pro", Arial, sans-serif; }
button:focus-visible, textarea:focus-visible, summary:focus-visible, .cell:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
textarea { font-family: var(--data); font-size: 0.82rem; width: 100%; min-height: 110px; padding: 10px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; resize: vertical; }
code { font-family: var(--data); font-size: 0.86em; background: var(--ok-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.note { border-inline-start: 3px solid var(--line); padding-inline-start: 12px; display: flex; flex-direction: column; gap: 4px; overflow-wrap: anywhere; }
main { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
section { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ledger { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0; border: 1px solid var(--line);
  border-radius: 8px; background: var(--surface); overflow: hidden; }
.tile { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; border-inline-end: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; min-width: 0; }
.tile .n { font-family: var(--data); font-variant-numeric: tabular-nums; font-size: 2rem; font-weight: 500; line-height: 1.1; }
.tile .k { font-weight: 600; display: flex; align-items: center; gap: 7px; }
.dot { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.s-reg { --c: var(--reg); --cb: var(--reg-bg); } .s-imp { --c: var(--imp); --cb: var(--imp-bg); }
.s-uns { --c: var(--uns); --cb: var(--uns-bg); } .s-wrong { --c: var(--wrong); --cb: var(--wrong-bg); }
.s-ok { --c: var(--ok); --cb: var(--ok-bg); } .s-chg { --c: var(--accent); --cb: var(--ok-bg); }
.s-inc { --c: var(--inc); --cb: var(--inc-bg); }
.dot, .cell { background: var(--c); }
.tile .n { color: var(--c); } .tile.s-ok .n { color: var(--muted); }
.strip { display: flex; flex-wrap: wrap; gap: 3px; }
.cell { width: 18px; height: 18px; border-radius: 3px; border: 0; padding: 0; cursor: default; }
button.cell { cursor: pointer; } button.cell:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
.cell.open { opacity: 0.55; }
.bar { display: flex; height: 18px; border-radius: 4px; overflow: hidden; gap: 2px; }
.bar .seg { background: var(--c); min-width: 3px; }
.more { margin-top: 4px; }
.bars { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 10px 12px; align-items: center; }
.bars .track { height: 14px; background: var(--ok-bg); border-radius: 3px; position: relative; min-width: 40px; }
.bars .fill { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 3px; background: var(--ok); min-width: 2px; }
.bars .fill.main { background: var(--accent); }
.bars .lab { min-width: 0; }
.panel { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { padding: 4px 10px; font-size: 0.88rem; }
.cards { display: flex; flex-direction: column; gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 12px;
  border-top: 3px solid var(--c); scroll-margin-top: 16px; }
.card[hidden] { display: none; }
.card .head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; }
.pill { font-size: 0.8rem; font-weight: 600; color: var(--c); background: var(--cb); border-radius: 4px; padding: 2px 8px; }
.card .q { font-weight: 500; overflow-wrap: anywhere; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.side { background: var(--bg); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.side .lbl { font-size: 0.76rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
[dir="rtl"] .side .lbl { letter-spacing: 0; }
.side .ver { font-size: 0.8rem; color: var(--muted); overflow-wrap: anywhere; }
.side .ans { font-family: var(--data); font-size: 0.92rem; overflow-wrap: anywhere; white-space: pre-wrap; max-height: 18em; overflow-y: auto; }
.side .rerun { font-size: 0.82rem; color: var(--muted); overflow-wrap: anywhere; }
.side .rerun.diff { color: var(--uns); }
.score { font-size: 0.72rem; border: 1px solid var(--line); color: var(--muted); border-radius: 3px; padding: 0 4px; white-space: nowrap; align-self: flex-start; }
.errs { font-size: 0.84rem; color: var(--muted); overflow-wrap: anywhere; }
details.ctx > summary { cursor: pointer; font-size: 0.9rem; font-weight: 500; }
.ctxgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; padding-top: 10px; }
.ctxgrid ul { margin: 0; padding-inline-start: 16px; font-size: 0.84rem; display: flex; flex-direction: column; gap: 3px; }
.ctxgrid li { overflow-wrap: anywhere; }
.tag { font-size: 0.72rem; border: 1px solid var(--wrong); color: var(--wrong); border-radius: 3px; padding: 0 4px; }
.judge { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.judge button { padding: 4px 10px; font-size: 0.88rem; }
details.wrongs > summary { cursor: pointer; font-weight: 500; }
details.wrongs ul { margin: 10px 0 0; padding-inline-start: 18px; font-size: 0.9rem; display: flex; flex-direction: column; gap: 4px; }
details.wrongs li { overflow-wrap: anywhere; }
.limits ul { margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 6px; max-width: 70ch; }
.out { display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 520px) { .bars { grid-template-columns: minmax(0, 1fr); gap: 4px 0; } .bars .val { margin-bottom: 8px; } h1 { font-size: 1.35rem; } }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
@media print { button, .filters, .out { display: none !important; } body { background: #fff; } }
/* Inputs of the browser version. The report itself uses the stylesheet of report_template.html. */
.inputs { display: flex; flex-direction: column; gap: 12px; }
.filebtn { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer;
  position: relative; display: inline-block; }
.filebtn:hover { border-color: var(--accent); }
.filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
details.own { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details.own > summary { cursor: pointer; padding: 10px 14px; font-weight: 500; }
details.own .body { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; max-width: 100%; }
select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cols { margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 4px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 16px; }
.opts label { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.msg { border: 1px solid var(--reg); background: var(--reg-bg); color: var(--ink); border-radius: 6px; padding: 10px 12px; overflow-wrap: anywhere; }
.warn { color: var(--uns); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.get ul { margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 6px; max-width: 70ch; }
button.done { border-color: var(--accent); font-weight: 600; }
details.own ol { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 8px; }
</style>
<!--/page-->
</head>
<body>
<!--page-->
<div class="wrap" id="app">
  <header class="top">
    <div class="lead">
      <h1 id="t-name">RIDI Update Check</h1>
      <p class="muted" id="t-tagline"></p>
    </div>
    <button type="button" id="lang" lang="ar">العربية</button>
  </header>

  <div class="inputs">
    <div class="row">
      <label for="sample-set" class="small"><span id="t-set-label"></span>
        <select id="sample-set"><option value="library" id="opt-set-library"></option><option value="medicines" id="opt-set-medicines"></option></select></label>
      <button type="button" id="btn-sample-key" aria-pressed="true"></button>
      <button type="button" id="btn-sample-nokey" aria-pressed="false"></button>
    </div>
    <details class="own" id="why" data-k="why">
      <summary id="t-why"></summary>
      <div class="body"><ol class="small" id="t-why-list"></ol></div>
    </details>
    <details class="own" id="own" data-k="own">
      <summary id="t-own"></summary>
      <div class="body">
        <p class="small muted" id="t-privacy"></p>
        <div class="row">
          <label class="filebtn" for="file"><span id="t-choose"></span><input type="file" id="file" accept=".csv,.tsv,.txt,text/csv,text/plain,text/tab-separated-values"></label>
        </div>
        <label for="paste" class="small" id="t-paste"></label>
        <textarea id="paste" spellcheck="false" dir="ltr"></textarea>
        <div>
          <p class="small" id="t-opts" style="font-weight:600"></p>
          <div class="opts small">
            <label for="mode"><span id="t-mode-label"></span>
              <select id="mode"><option value="auto" id="opt-auto"></option><option value="nokey" id="opt-nokey"></option></select></label>
            <label for="sim"><span id="t-sim-label"></span>
              <select id="sim"><option value="1" id="opt-sim1"></option><option value="0.9" id="opt-sim90"></option><option value="0.75" id="opt-sim75"></option></select></label>
          </div>
        </div>
        <div class="row"><button type="button" class="primary" id="btn-run"></button></div>
        <div>
          <p class="small" id="t-format" style="font-weight:600"></p>
          <p class="small muted" id="t-cols-note"></p>
          <ul class="cols small" id="t-cols"></ul>
        </div>
      </div>
    </details>
    <p class="msg" id="err" role="alert" hidden></p>
    <div class="small muted note" id="source-note"></div>
  </div>

  <main id="report"></main>

  <section class="get">
    <h2 id="t-get"></h2>
    <ul class="muted" id="t-get-list"></ul>
  </section>
  <section class="limits">
    <h2 id="t-limits"></h2>
    <ul class="muted" id="t-limit-list"></ul>
  </section>
  <p class="small muted">ridi-check 0.8.0 · the RIDI method</p>
</div>
<script id="ridi-strings" type="application/json">{"key":{"en":{"passages":"The retrieved passages differ between the versions in {k} of the {n} cases that list passages.","passagesNote":" This is a count, not a cause.","passagesOrder":" In {r} case(s) the same passages come in another order or number.","ctxOrder":"The same passages were retrieved, in another order or another number of times.","passagesContent":" In {r} case(s) a passage kept its name while its content changed.","ctxMoved":"In both versions, with a change","ctxRank":"rank {a} → {b}","ctxScore":"score {a} → {b}","ctxContent":"content changed","passagesAll":"The retrieved passages differ between the versions in all {n} cases that list passages, so this count does not set any group of cases apart. An update that changes how documents are split, or how passages are named, gives this result.","passagesNone":"The retrieved passages are the same in both versions in all {n} cases that list passages.","passagesNoneOne":"The retrieved passages are the same in both versions in the one case that lists passages.","caseOnly":"{n} case(s) hold answers that differ only in letter case, as in mg and Mg, which is not counted as a change: {ids}. Read them where the case of a letter carries meaning.","name":"RIDI Update Check","langBtn":"العربية","tagline":"The current and the proposed version of an assistant, run on the same questions. Which answers changed, and which changes hold when each version is run again.","source":"{n} cases from {file}. Report written {when} by ridi-check {version}.","sourceOne":"1 case from {file}. Report written {when} by ridi-check {version}.","versions":"Current version: {a}. Proposed version: {b}.","ledger":"Where each case landed","state":{"unstable":"Unstable on re-run","incomplete":"Not compared","stable_regression":"Stable regressions","stable_improvement":"Stable improvements","regression_unconfirmed":"Regressions, not re-run","improvement_unconfirmed":"Improvements, not re-run","wrong_both":"Wrong in both versions","correct_both":"Correct in both versions"},"sub":{"unstable":"A version disagreed with itself","incomplete":"A call failed, so a first-run answer is missing","stable_regression":"Right before, wrong after, in every run","stable_improvement":"Wrong before, right after, in every run","wrong_both":"No change, still wrong","correct_both":"No change"},"pill":{"unstable":"Unstable on re-run","incomplete":"Not compared: a call failed","stable_regression":"Stable regression","stable_improvement":"Stable improvement","regression_unconfirmed":"Regression, not re-run","improvement_unconfirmed":"Improvement, not re-run","wrong_both":"Wrong in both versions","wrong_both_changed":"Wrong in both, answer changed","wrong_both_changed_unconfirmed":"Wrong in both, answer changed, not re-run","wrong_both_varied":"Wrong in both, answer varied on re-run","correct_both_varied":"Correct in both, answer varied on re-run","correct_both_changed":"Correct in both, answer changed","correct_both_changed_unconfirmed":"Correct in both, answer changed, not re-run"},"unconfSub":"Not confirmed by a second run","stableNote":"A case is stable when every run of each version agreed with that version's first run. Runs per version in this file: current {b}, proposed {u}. Two runs is a thin estimate of re-run variation; more runs make the stable label firmer.","stripNote":"Each cell is one case, in file order. Select a coloured cell to open it.","stripBar":"With more than {max} cases the strip is one bar: each colour's share of the {n} cases.","shownOf":"Showing {a} of {b}.","showMore":"Show {n} more","showAll":"Show all {n}","rates":"Change between versions against re-run variation","barMain":"Current vs proposed","barB":"Current, run twice","barU":"Proposed, run twice","of":"{k} of {n}","rateWithin":"The overall change is no larger than the re-run variation of one version. Read the stable cases below, not the total.","rateAbove":"The overall change ({t}%) is larger than t   });
  $("mode").addEventListener("change", (ev) => { state.modePref = ev.target.value; if (state.source === "file") { state.errorCode = null; load("file", state.text); } });
  $("sim").addEventListener("change", (ev) => { state.sim = parseFloat(ev.target.value); state.errorCode = null; load(state.source, state.text); });
  $("report").addEventListener("click", (ev) => {
    const b = ev.target.closest("button"); if (!b) return;
    if (b.dataset.filter) { state.filter = b.dataset.filter; state.shown = PAGE; applyFilter(); }
    else if (b.id === "more") { state.shown += PAGE; applyFilter(); }
    else if (b.id === "show-all") { state.shown = Infinity; applyFilter(); }
    else if (b.dataset.judge) {
      const id = state.D.cards[+b.dataset.i].id;
      if (state.judge[id] === b.dataset.judge) delete state.judge[id]; else state.judge[id] = b.dataset.judge;
      store.set(judgeKey(), JSON.stringify(state.judge));
      b.parentElement.querySelectorAll("[data-judge]").forEach((x) => x.setAttribute("aria-pressed", state.judge[id] === x.dataset.judge));
      const line = $("judged"); if (line) line.textContent = judgedText();
    }
    else if (b.dataset.go) {   /* the card may be on a page that is not drawn yet */
      if (state.filter !== "all" || +b.dataset.go >= state.shown) { state.filter = "all"; state.shown = Math.max(state.shown, +b.dataset.go + 1); applyFilter(); }
      const el = $("c-" + b.dataset.go); if (el) el.scrollIntoView({ block: "start" });
    }
    else if (b.id === "copy-j") {
      const ids = state.D.stable_change_ids.filter((id) => state.judge[id]);
      copyOut(RidiCore.toCsv(["case_id", "judgment"], ids.map((id) => [id, state.judge[id]])), b);
    }
    else if (b.id === "copy-r") { const r = RidiCore.reviewTable(state.A, state.judge); copyOut(RidiCore.toCsv(r.header, r.rows), b); }
    else if (b.id === "forget") { state.judge = {}; store.del(judgeKey()); render(); }
  });

  const kept = tab.get();
  if (kept) { $("paste").value = kept; load("file", kept); }
  if (!state.D) { state.errorCode = null; load("sample-key", SAMPLE); }
})();
</script>
<!--/page-->
</body>
