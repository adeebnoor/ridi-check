<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--page-->
<title>RIDI Update Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One working column: a ledger of case states with a one-cell-per-case strip, then change against
   re-run variation on one scale, then the cases to review. No network: fonts are the reader's own. */
:root {
  --bg: #F2F5F7; --surface: #FFFFFF; --ink: #15212B; --muted: #566876; --line: #D3DCE3;
  --accent: #0C5FA8; --accent-ink: #FFFFFF;
  --reg: #B3362B; --reg-bg: #FBE9E6; --imp: #1C774A; --imp-bg: #E2F3EA;
  --uns: #8F5E00; --uns-bg: #FBEFD3; --wrong: #5F4F8C; --wrong-bg: #ECE8F5;
  --ok: #8FA3B1; --ok-bg: #E7EDF1; --inc: #4B5A66; --inc-bg: #E1E6EA;
  --text: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", "Noto Sans", "Noto Sans Arabic", Tahoma, sans-serif;
  --data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Noto Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151B; --surface: #17212A; --ink: #E4ECF2; --muted: #94A5B3; --line: #2C3A46;
    --accent: #6DB3F2; --accent-ink: #08131C;
    --reg: #F08A7E; --reg-bg: #3A1C19; --imp: #6FD19B; --imp-bg: #15301F;
    --uns: #E9B955; --uns-bg: #36290E; --wrong: #B5A6E0; --wrong-bg: #262038;
    --ok: #50626F; --ok-bg: #1D2831; --inc: #A9B6C0; --inc-bg: #25313B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151B; --surface: #17212A; --ink: #E4ECF2; --muted: #94A5B3; --line: #2C3A46;
  --accent: #6DB3F2; --accent-ink: #08131C;
  --reg: #F08A7E; --reg-bg: #3A1C19; --imp: #6FD19B; --imp-bg: #15301F;
  --uns: #E9B955; --uns-bg: #36290E; --wrong: #B5A6E0; --wrong-bg: #262038;
  --ok: #50626F; --ok-bg: #1D2831; --inc: #A9B6C0; --inc-bg: #25313B; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--text); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 940px; margin-inline: auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 1.05rem; font-weight: 600; text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
.num { font-family: var(--data); font-variant-numeric: tabular-nums; }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-start; justify-content: space-between; }
header.top .lead { max-width: 62ch; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 7px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, textarea:focus-visible, summary:focus-visible, .cell:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
textarea { font-family: var(--data); font-size: 0.82rem; width: 100%; min-height: 110px; padding: 10px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; resize: vertical; }
code { font-family: var(--data); font-size: 0.86em; background: var(--ok-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.note { border-inline-start: 3px solid var(--line); padding-inline-start: 12px; display: flex; flex-direction: column; gap: 4px; overflow-wrap: anywhere; }
main { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
section { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ledger { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0; border: 1px solid var(--line);
  border-radius: 8px; background: var(--surface); overflow: hidden; }
.tile { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; border-inline-end: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; min-width: 0; }
.tile .n { font-family: var(--data); font-variant-numeric: tabular-nums; font-size: 2rem; font-weight: 500; line-height: 1.1; }
.tile .k { font-weight: 600; display: flex; align-items: center; gap: 7px; }
.dot { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.s-reg { --c: var(--reg); --cb: var(--reg-bg); } .s-imp { --c: var(--imp); --cb: var(--imp-bg); }
.s-uns { --c: var(--uns); --cb: var(--uns-bg); } .s-wrong { --c: var(--wrong); --cb: var(--wrong-bg); }
.s-ok { --c: var(--ok); --cb: var(--ok-bg); } .s-chg { --c: var(--accent); --cb: var(--ok-bg); }
.s-inc { --c: var(--inc); --cb: var(--inc-bg); }
.dot, .cell { background: var(--c); }
.tile .n { color: var(--c); } .tile.s-ok .n { color: var(--muted); }
.strip { display: flex; flex-wrap: wrap; gap: 3px; }
.cell { width: 18px; height: 18px; border-radius: 3px; border: 0; padding: 0; cursor: default; }
button.cell { cursor: pointer; } button.cell:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
.cell.open { opacity: 0.55; }
.bars { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 10px 12px; align-items: center; }
.bars .track { height: 14px; background: var(--ok-bg); border-radius: 3px; position: relative; min-width: 40px; }
.bars .fill { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 3px; background: var(--ok); min-width: 2px; }
.bars .fill.main { background: var(--accent); }
.bars .lab { min-width: 0; }
.panel { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { padding: 4px 10px; font-size: 0.88rem; }
.cards { display: flex; flex-direction: column; gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 12px;
  border-top: 3px solid var(--c); scroll-margin-top: 16px; }
.card[hidden] { display: none; }
.card .head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; }
.pill { font-size: 0.8rem; font-weight: 600; color: var(--c); background: var(--cb); border-radius: 4px; padding: 2px 8px; }
.card .q { font-weight: 500; overflow-wrap: anywhere; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.side { background: var(--bg); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.side .lbl { font-size: 0.76rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
[dir="rtl"] .side .lbl { letter-spacing: 0; }
.side .ver { font-size: 0.8rem; color: var(--muted); overflow-wrap: anywhere; }
.side .ans { font-family: var(--data); font-size: 0.92rem; overflow-wrap: anywhere; white-space: pre-wrap; max-height: 18em; overflow-y: auto; }
.side .rerun { font-size: 0.82rem; color: var(--muted); overflow-wrap: anywhere; }
.side .rerun.diff { color: var(--uns); }
.score { font-size: 0.72rem; border: 1px solid var(--line); color: var(--muted); border-radius: 3px; padding: 0 4px; white-space: nowrap; align-self: flex-start; }
.errs { font-size: 0.84rem; color: var(--muted); overflow-wrap: anywhere; }
details.ctx > summary { cursor: pointer; font-size: 0.9rem; font-weight: 500; }
.ctxgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; padding-top: 10px; }
.ctxgrid ul { margin: 0; padding-inline-start: 16px; font-size: 0.84rem; display: flex; flex-direction: column; gap: 3px; }
.ctxgrid li { overflow-wrap: anywhere; }
.tag { font-size: 0.72rem; border: 1px solid var(--wrong); color: var(--wrong); border-radius: 3px; padding: 0 4px; }
.judge { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.judge button { padding: 4px 10px; font-size: 0.88rem; }
details.wrongs > summary { cursor: pointer; font-weight: 500; }
details.wrongs ul { margin: 10px 0 0; padding-inline-start: 18px; font-size: 0.9rem; display: flex; flex-direction: column; gap: 4px; }
details.wrongs li { overflow-wrap: anywhere; }
.limits ul { margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 6px; max-width: 70ch; }
.out { display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 520px) { .bars { grid-template-columns: minmax(0, 1fr); gap: 4px 0; } .bars .val { margin-bottom: 8px; } h1 { font-size: 1.35rem; } }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
@media print { button, .filters, .out { display: none !important; } .card[hidden] { display: flex; } body { background: #fff; } }
/* Inputs of the browser version. The report itself uses the stylesheet of report_template.html. */
.inputs { display: flex; flex-direction: column; gap: 12px; }
.filebtn { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer;
  position: relative; display: inline-block; }
.filebtn:hover { border-color: var(--accent); }
.filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
details.own { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details.own > summary { cursor: pointer; padding: 10px 14px; font-weight: 500; }
details.own .body { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; max-width: 100%; }
select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cols { margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 4px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 16px; }
.opts label { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.msg { border: 1px solid var(--reg); background: var(--reg-bg); color: var(--ink); border-radius: 6px; padding: 10px 12px; overflow-wrap: anywhere; }
.warn { color: var(--uns); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.get ul { margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 6px; max-width: 70ch; }
</style>
<!--/page-->
</head>
<body>
<!--page-->
<div class="wrap" id="app">
  <header class="top">
    <div class="lead">
      <h1 id="t-name">RIDI Update Check</h1>
      <p class="muted" id="t-tagline"></p>
    </div>
    <button type="button" id="lang"></button>
  </header>

  <div class="inputs">
    <div class="row">
      <button type="button" id="btn-sample-key" aria-pressed="true"></button>
      <button type="button" id="btn-sample-nokey" aria-pressed="false"></button>
    </div>
    <details class="own" id="own" data-k="own">
      <summary id="t-own"></summary>
      <div class="body">
        <p class="small muted" id="t-privacy"></p>
        <div class="row">
          <label class="filebtn" for="file"><span id="t-choose"></span><input type="file" id="file" accept=".csv,.tsv,.txt,text/csv,text/plain,text/tab-separated-values"></label>
        </div>
        <label for="paste" class="small" id="t-paste"></label>
        <textarea id="paste" spellcheck="false" dir="ltr"></textarea>
        <div>
          <p class="small" id="t-opts" style="font-weight:600"></p>
          <div class="opts small">
            <label for="mode"><span id="t-mode-label"></span>
              <select id="mode"><option value="auto" id="opt-auto"></option><option value="nokey" id="opt-nokey"></option></select></label>
            <label for="sim"><span id="t-sim-label"></span>
              <select id="sim"><option value="1" id="opt-sim1"></option><option value="0.9" id="opt-sim90"></option><option value="0.75" id="opt-sim75"></option></select></label>
          </div>
        </div>
        <div class="row"><button type="button" class="primary" id="btn-run"></button></div>
        <div>
          <p class="small" id="t-format" style="font-weight:600"></p>
          <p class="small muted" id="t-cols-note"></p>
          <ul class="cols small" id="t-cols"></ul>
        </div>
      </div>
    </details>
    <p class="msg" id="err" role="alert" hidden></p>
    <div class="small muted note" id="source-note"></div>
  </div>

  <main id="report"></main>

  <section class="get">
    <h2 id="t-get"></h2>
    <ul class="muted" id="t-get-list"></ul>
  </section>
  <section class="limits">
    <h2 id="t-limits"></h2>
    <ul class="muted" id="t-limit-list"></ul>
  </section>
  <p class="small muted">ridi-check 0.3.1 · the RIDI method</p>
</div>

<script>
/* ridi-check analysis for the browser. A line-for-line port of contract.py, analysis.py and the data
   part of report.py. tests/test_web.py runs this file in Node against the Python on random files:
   change both together. */
const RidiCore = (function () {
  "use strict";
  const KEY = "key", NOKEY = "nokey";
  const RUN_COLUMN = /^(baseline|updated)(?:_repeat([0-9]*))?_(answer|correct)$/;
  const KEY_STATES = ["stable_regression", "stable_improvement", "regression_unconfirmed", "improvement_unconfirmed",
    "unstable", "wrong_both", "correct_both", "incomplete"];
  const NOKEY_STATES = ["stable_change", "change_unconfirmed", "unstable", "same", "incomplete"];
  const UNCHANGED = new Set(["correct_both", "same"]);
  const NEGATIONS = new Set("not no never neither nor without none cannot t لا غير لم لن بدون ليس ليست".split(" "));
  const CSS_CLASS = { stable_regression: "s-reg", regression_unconfirmed: "s-reg", stable_improvement: "s-imp",
    improvement_unconfirmed: "s-imp", stable_change: "s-chg", change_unconfirmed: "s-chg", unstable: "s-uns",
    wrong_both: "s-wrong", correct_both: "s-ok", same: "s-ok", incomplete: "s-inc" };

  function RidiError(code, info) { const e = new Error(code); e.code = code; e.info = info || {}; return e; }
  const strip = (s) => String(s).replace(/^\s+|\s+$/g, "");

  /* ---------- reading ---------- */
  function sniffDelimiter(text) {
    if (!strip(text)) return ",";
    const header = text.replace(/^﻿+/, "").split(/\r\n|\n|\r/)[0] || "";

  function readRecords(text) {

  }

    mode = mode || "auto";
    const records = readRecords(text);
    if (records.length < 2) throw RidiError("empty");
    const header = records[0][1].map((h) => strip(h).toLowerCase());
    const seen = new Set();
    for (const name of header) { if (name && seen.has(name)) throw RidiError("dupColumn", { name }); seen.add(name); }
    const col = {}; header.forEach((name, i) => { col[name] = i; });
    if (!("case_id" in col)) throw RidiError("noId");

    const runs = {}; /* "side|kind" -> [[index, position]] in header order */
    header.forEach((name, position) => {
      const m = RUN_COLUMN.exec(name); if (!m) return;
      let index;
      if (m[2] === undefined) index = 0;
      else if (m[2] === "") index = 1;
      else { index = parseInt(m[2], 10); if (index < 1) throw RidiError("repeatZero", { name }); }
      const slot = runs[m[1] + "|" + m[3]] = runs[m[1] + "|" + m[3]] || [];
      const clash = slot.find((x) => x[0] === index);
      if (clash) throw RidiError("sameRun", { a: header[clash[1]], b: name });
      slot.push([index, position]);
    });

    const hasAnswers = "baseline_answer" in col && "updated_answer" in col;

    if (mode === KEY && !hasKey) throw RidiError("needKey");
    if (mode === NOKEY && !hasAnswers) throw RidiError("needAnswers");
    const resolved = mode !== "auto" ? mode : (hasKey ? KEY : NOKEY), key = resolved === KEY;

    const cases = [], firstRow = new Map();
    for (const [row, record] of records.slice(1)) {
      const at = (i) => (i >= 0 && i < record.length ? strip(record[i]) : "");
      const get = (name) => at(name in col ? col[name] : -1);
      const id = get("case_id");
      if (!id) throw RidiError("rowNoId", { row });
      if (firstRow.has(id)) throw RidiError("rowDup", { row, id, first: firstRow.get(id) });
      firstRow.set(id, row);
      const c = { id, row, q: get("question"), expected: get("expected"), b: [], u: [],
        bc: splitContext(get("baseline_context")), uc: splitContext(get("updated_context")), err: get("run_errors"), incomplete: false };
      for (const side of ["baseline", "updated"]) {
        const answers = new Map(runs[side + "|answer"] || []), corrects = runs[side + "|correct"] || [];
        const scored = new Map();
        for (const [index, position] of corrects) {

          if (v === "") scored.set(index, null);
          else if (v !== "0" && v !== "1") throw RidiError("rowBin", { row, id, col: header[position], value: v });
          else scored.set(index, +v);

        const out = [];

          const ans = answers.has(index) ? at(answers.get(index)) : "";
          const cor = key && scored.has(index) ? scored.get(index) : null;
          const missing = key ? cor === null : ans === "";
          if (index === 0) {
            if (missing) {
              if (!c.err) throw RidiError("rowEmptyFirst", { row, id, col: runColumn(side, 1, key ? "correct" : "answer") });
              c.incomplete = true; continue;
            }
          } else if (ans === "" && cor === null) continue;
          else if (key && cor === null) throw RidiError("rowNoCorrect", { row, id, a: runColumn(side, index + 1, "answer"), c: runColumn(side, index + 1, "correct") });
          out.push({ ans, cor });
        }
        c[side === "baseline" ? "b" : "u"] = out;
      }
      cases.push(c);
    }
    return { cases, mode: resolved };
  }

  /* ---------- analysis ---------- */
  function normalise(text) {
    return String(text).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, " ").replace(/\s+/g, " ").trim();
  }
  function sameAnswer(a, b, threshold) {
    const x = normalise(a), y = normalise(b);
    if (x === y) return true;
    if (!(threshold < 1)) return false;
    const A = new Set(x.split(" ")), B = new Set(y.split(" "));
    const neg = (S) => { for (const w of S) if (NEGATIONS.has(w)) return true; return false; };
    if (neg(A) !== neg(B)) return false;
    const nums = (S) => Array.from(S).filter((w) => /^\p{Nd}+$/u.test(w)).sort().join(" ");
    if (nums(A) !== nums(B)) return false;
    let shared = 0; A.forEach((w) => { if (B.has(w)) shared++; });
    const union = A.size + B.size - shared;
    return union > 0 && shared / union >= threshold;
  }
  const makeEq = (mode, threshold) => (mode === KEY ? (r, s) => r.cor === s.cor : (r, s) => sameAnswer(r.ans, s.ans, threshold));
  function classify(c, mode, threshold) {
    if (c.incomplete) return "incomplete";
    const eq = makeEq(mode, threshold), b = c.b, u = c.u;
    if (!b.every((r) => eq(r, b[0])) || !u.every((r) => eq(r, u[0]))) return "unstable";
    const key = mode === KEY;
    if (eq(b[0], u[0])) return !key ? "same" : (b[0].cor ? "correct_both" : "wrong_both");
    const confirmed = b.length > 1 && u.length > 1;
    if (!key) return confirmed ? "stable_change" : "change_unconfirmed";
    if (b[0].cor) return confirmed ? "stable_regression" : "regression_unconfirmed";
    return confirmed ? "stable_improvement" : "improvement_unconfirmed";
  }
  function analyse(cases, mode, threshold) {
    threshold = threshold === undefined ? 1 : threshold;
    const key = mode === KEY, eq = makeEq(mode, threshold);
    const a = { mode, threshold, items: [], counts: {}, answerChange: {}, n: cases.length, nCompared: 0, changed: 0,
      rerunB: 0, rerunBN: 0, rerunU: 0, rerunUN: 0, anyB: 0, anyU: 0, confirmable: 0, maxRunsB: 0, maxRunsU: 0,
      correctB: 0, correctU: 0, regressions: 0, improvements: 0 };
    (key ? KEY_STATES : NOKEY_STATES).forEach((s) => { a.counts[s] = 0; });
    for (const c of cases) {
      const s = classify(c, mode, threshold);
      a.counts[s]++; a.items.push({ c, s });
      if (s === "incomplete") continue;
      const b = c.b, u = c.u;
      a.nCompared++; a.maxRunsB = Math.max(a.maxRunsB, b.length); a.maxRunsU = Math.max(a.maxRunsU, u.length);
      if (!eq(b[0], u[0])) a.changed++;
      if (b.length > 1) { a.rerunBN++; if (!eq(b[0], b[1])) a.rerunB++; if (!b.every((r) => eq(r, b[0]))) a.anyB++; }
      if (u.length > 1) { a.rerunUN++; if (!eq(u[0], u[1])) a.rerunU++; if (!u.every((r) => eq(r, u[0]))) a.anyU++; }
      if (s === "wrong_both" && b.concat(u).every((r) => r.ans)) {
        const byAnswer = classify(c, NOKEY, threshold);
        if (byAnswer === "stable_change") a.answerChange[c.id] = "stable";
        else if (byAnswer === "change_unconfirmed") a.answerChange[c.id] = "unconfirmed";
      }
      if (b.length > 1 && u.length > 1) a.confirmable++;
      if (key) {
        a.correctB += b[0].cor; a.correctU += u[0].cor;
        if (b[0].cor && !u[0].cor) a.regressions++;
        if (!b[0].cor && u[0].cor) a.improvements++;
      }
    }
    a.ids = (state) => a.items.filter((it) => it.s === state).map((it) => it.c.id);
    return a;
  }

  /* ---------- report data ---------- */
  const rate = (count, n) => (n ? { count, n } : null);
  function buildSummary(a) {
    const key = a.mode === KEY;
    const first = { change_between_versions: rate(a.changed, a.nCompared) || { count: 0, n: 0 },
      rerun_variation_current: rate(a.rerunB, a.rerunBN), rerun_variation_proposed: rate(a.rerunU, a.rerunUN) };
    if (key) Object.assign(first, { accuracy_current: rate(a.correctB, a.nCompared), accuracy_proposed: rate(a.correctU, a.nCompared),
      regressions: a.regressions, improvements: a.improvements,
      changes_visible_in_mean_accuracy: Math.abs(a.improvements - a.regressions),
      changes_cancelled_in_mean_accuracy: 2 * Math.min(a.regressions, a.improvements) });
    const caseIds = {}; Object.keys(a.counts).forEach((s) => { if (!UNCHANGED.has(s)) caseIds[s] = a.ids(s); });
    const summary = { mode: a.mode, similarity_threshold: a.threshold, cases: a.n, cases_compared: a.nCompared,
      confirmable_cases: a.confirmable, runs_per_version: { current: a.maxRunsB, proposed: a.maxRunsU },
      states: Object.assign({}, a.counts), case_ids: caseIds, first_run: first,
      any_run_disagreement: { current: a.anyB, proposed: a.anyU } };
    if (key) summary.wrong_both_answer_changed = {
      stable: Object.keys(a.answerChange).filter((i) => a.answerChange[i] === "stable"),
      unconfirmed: Object.keys(a.answerChange).filter((i) => a.answerChange[i] === "unconfirmed") };
    return summary;
  }
  function passageDifference(c) {
    const inB = new Set(c.bc), inU = new Set(c.uc);
    const onlyB = c.bc.filter((p) => !inU.has(p)), onlyU = c.uc.filter((p) => !inB.has(p));
    return [onlyB, onlyU, c.bc.length - onlyB.length];
  }
  function reviewTable(a, judgments) {
    judgments = judgments || {};
    const key = a.mode === KEY, cases = a.items.map((it) => it.c);
    const runsB = Math.max(0, ...cases.map((c) => c.b.length)) || 1, runsU = Math.max(0, ...cases.map((c) => c.u.length)) || 1;
    const has = (f) => cases.some(f);
    const anyAnswer = cases.some((c) => c.b.concat(c.u).some((r) => r.ans));
    const hasQ = has((c) => c.q), hasE = has((c) => c.expected), hasErr = has((c) => c.err);
    const sides = [["baseline", runsB, "b"], ["updated", runsU, "u"]];
    let header = ["case_id", "state", key ? "answer_change" : "judgment"];
    if (hasQ) header.push("question"); if (hasE) header.push("expected");
    const answerCols = anyAnswer || !key;
    if (answerCols) for (const [side, n] of sides) for (let k = 1; k <= n; k++) header.push(runColumn(side, k, "answer"));
    if (key) for (const [side, n] of sides) for (let k = 1; k <= n; k++) header.push(runColumn(side, k, "correct"));
    const withContext = has((c) => c.bc.length) || has((c) => c.uc.length);
    if (withContext) header = header.concat(["baseline_context", "updated_context", "passages_only_current", "passages_only_proposed"]);
    if (hasErr) header.push("run_errors");
    const rows = [];
    for (const { c, s } of a.items) {
      if (UNCHANGED.has(s)) continue;
      const row = [c.id, s, key ? (a.answerChange[c.id] || "") : (judgments[c.id] || "")];
      if (hasQ) row.push(c.q); if (hasE) row.push(c.expected);
      if (answerCols) for (const [, n, f] of sides) for (let k = 0; k < n; k++) row.push(k < c[f].length ? c[f][k].ans : "");
      if (key) for (const [, n, f] of sides) for (let k = 0; k < n; k++) row.push(k < c[f].length && c[f][k].cor !== null ? String(c[f][k].cor) : "");
      if (withContext) { const [onlyB, onlyU] = passageDifference(c); row.push(c.bc.join(" | "), c.uc.join(" | "), onlyB.join(" | "), onlyU.join(" | ")); }
      if (hasErr) row.push(c.err);
      rows.push(row);
    }
    return { header, rows };
  }
  function toCsv(header, rows) {
    const cell = (v) => { const s = v === null || v === undefined ? "" : String(v); return /[,"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    return [header].concat(rows).map((r) => r.map(cell).join(",") + "\n").join("");
  }
  function ledgerTiles(a) {
    const n = (s) => a.counts[s] || 0;
    let stable, unconfirmed, rest;
    if (a.mode === KEY) { stable = ["stable_regression", "stable_improvement"]; unconfirmed = ["regression_unconfirmed", "improvement_unconfirmed"]; rest = ["unstable", "wrong_both", "correct_both"]; }
    else { stable = ["stable_change"]; unconfirmed = ["change_unconfirmed"]; rest = ["unstable", "same"]; }
    const anyUnconfirmed = unconfirmed.some((s) => n(s));
    return (a.confirmable || !anyUnconfirmed ? stable : []).concat(anyUnconfirmed ? unconfirmed : [], rest, n("incomplete") ? ["incomplete"] : []);
  }
  function runsForPage(runs, key, threshold) {
    return runs.map((r, i) => {
      const first = runs[0];
      const same = key ? r.cor === first.cor && (!r.ans || !first.ans || sameAnswer(r.ans, first.ans, threshold)) : sameAnswer(r.ans, first.ans, threshold);
      return { ans: r.ans, cor: r.cor, same: i ? !!same : true };

  function pageData(a) {
    const key = a.mode === KEY, cards = [], stripCells = [], wrong = [];
    for (const { c, s } of a.items) {
      const flag = a.answerChange[c.id] || null;
      let card = -1;
      if (!UNCHANGED.has(s) && (s !== "wrong_both" || flag)) {
        const [onlyB, onlyU, kept] = passageDifference(c);
        card = cards.length;
        cards.push({ id: c.id, state: s, flag, q: c.q, expected: c.expected, b: runsForPage(c.b, key, a.threshold), u: runsForPage(c.u, key, a.threshold),
          rem: onlyB, add: onlyU, kept, err: c.err });
      }
      stripCells.push([c.id, s, card]);
      if (s === "wrong_both") wrong.push([c.id, c.q, flag]);
    }
    const classes = {}; Object.keys(a.counts).forEach((s) => { classes[s] = CSS_CLASS[s]; });
    return { summary: buildSummary(a), tiles: ledgerTiles(a), classes,
      acc: key && a.nCompared ? { a: a.correctB, b: a.correctU, n: a.nCompared, r: a.regressions, i: a.improvements } : null,

    $("t-opts").textContent = u("opts"); $("t-mode-label").textContent = u("modeLabel"); $("t-sim-label").textContent = u("sameWhen");
    $("opt-auto").textContent = u("modeAuto"); $("opt-nokey").textContent = u("modeNoKey");
    $("opt-sim1").textContent = u("simExact"); $("opt-sim90").textContent = u("sim90"); $("opt-sim75").textContent = u("sim75");
    $("mode").value = state.modePref; $("sim").value = String(state.sim);
    $("t-get").textContent = u("getTitle"); $("t-get-list").innerHTML = UI[state.lang].getList.map((x) => "<li>" + esc(x) + "</li>").join("");
    if (state.errorCode) state.error = fill(UI[state.lang].err[state.errorCode.code] || UI[state.lang].err.read, state.errorCode.info);
    const err = $("err"); err.hidden = !state.error; err.textContent = state.error || "";
    if (!state.D) { $("report").innerHTML = ""; return; }
    let note = "<span>" + esc(state.source === "sample-key" ? u("noteKey") : state.source === "sample-nokey" ? u("noteNoKey") : u("noteFile", { n: state.A.n })) + "</span>";
    note += "<span>" + esc(state.mode === "key" ? t("modeNote") : t("modeNote", { rule: state.sim >= 1 ? t("simExact") : t("simWords", { p: fmt(state.sim * 100) }) })) + "</span>";
    $("source-note").innerHTML = note;
    $("t-limits").textContent = t("limits"); $("t-limit-list").innerHTML = L().limitList.map((x) => "<li>" + esc(x) + "</li>").join("");
    $("report").innerHTML = reportHTML();
    open.forEach((k) => { const d = Array.from(document.querySelectorAll("details[data-k]")).find((x) => x.dataset.k === k); if (d) d.open = true; });
    applyFilter();
  }
  function copyOut(text) {
    const msg = $("copy-msg"), out = $("csv-out");
    const fail = () => { out.hidden = false; out.value = text; out.focus(); out.select(); msg.textContent = u("copyFail"); };
    try { navigator.clipboard.writeText(text).then(() => { msg.textContent = u("copied"); out.hidden = false; out.value = text; }, fail); } catch (e) { fail(); }
  }

  $("lang").addEventListener("click", () => { state.lang = state.lang === "ar" ? "en" : "ar"; store.set("ridi-lang", state.lang); render(); });
  $("btn-sample-key").addEventListener("click", () => { state.errorCode = null; load("sample-key", SAMPLE); });
  $("btn-sample-nokey").addEventListener("click", () => { state.errorCode = null; load("sample-nokey", SAMPLE); });
  $("btn-run").addEventListener("click", () => { state.errorCode = null; load("file", $("paste").value); });
  $("file").addEventListener("change", (ev) => {
    const f = ev.target.files && ev.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { $("paste").value = String(rd.result); state.errorCode = null; load("file", String(rd.result)); };
    rd.onerror = () => { state.errorCode = { code: "read", info: {} }; render(); };
    rd.readAsText(f);
  });
  $("mode").addEventListener("change", (ev) => { state.modePref = ev.target.value; if (state.source === "file") { state.errorCode = null; load("file", state.text); } });
  $("sim").addEventListener("change", (ev) => { state.sim = parseFloat(ev.target.value); state.errorCode = null; load(state.source, state.text); });
  $("report").addEventListener("click", (ev) => {
    const b = ev.target.closest("button"); if (!b) return;
    if (b.dataset.filter) { state.filter = b.dataset.filter; applyFilter(); }
    else if (b.dataset.judge) {
      const id = state.D.cards[+b.dataset.i].id;
      if (state.judge[id] === b.dataset.judge) delete state.judge[id]; else state.judge[id] = b.dataset.judge;
      store.set(judgeKey(), JSON.stringify(state.judge));
      b.parentElement.querySelectorAll("[data-judge]").forEach((x) => x.setAttribute("aria-pressed", state.judge[id] === x.dataset.judge));
      const line = $("judged"); if (line) line.textContent = judgedText();
    }
    else if (b.dataset.go) { if (state.filter !== "all") { state.filter = "all"; applyFilter(); } const el = $("c-" + b.dataset.go); if (el) el.scrollIntoView({ block: "start" }); }
    else if (b.id === "copy-j") {
      const ids = state.D.stable_change_ids.filter((id) => state.judge[id]);
      copyOut(RidiCore.toCsv(["case_id", "judgment"], ids.map((id) => [id, state.judge[id]])));
    }
    else if (b.id === "copy-r") { const r = RidiCore.reviewTable(state.A, state.judge); copyOut(RidiCore.toCsv(r.header, r.rows)); }
  });

  load("sample-key", SAMPLE);
})();
</script>
<!--/page-->
</body>
</html>
