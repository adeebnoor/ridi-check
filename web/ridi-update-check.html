<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--page-->
<title>RIDI Update Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: an ink band names the page and holds what the reader sets. Under it, one working column: the
   ledger of case states with its one-cell-per-case strip, change against re-run variation on one scale,
   then the cases to review. No network: fonts are the reader's own. */
:root {
  --bg: #F4F6F9; --surface: #FFFFFF; --sunken: #EEF2F6; --ink: #101C28; --muted: #55667A; --line: #D5DDE6;
  --accent: #1A56C4; --accent-ink: #FFFFFF; --accent-bg: #E6EEFB; --mark: #DCE8FC;
  --band: #0E2036; --band-ink: #F2F6FA; --band-muted: #A8BACD; --band-line: #2C4561; --band-control: #172F4A;
  --signal: #F2B544;
  --reg: #B3362B; --reg-bg: #FBE9E6; --imp: #1C774A; --imp-bg: #E2F3EA;
  --uns: #8F5E00; --uns-bg: #FBEFD3; --wrong: #5F4F8C; --wrong-bg: #ECE8F5;
  --ok: #8FA3B1; --ok-bg: #E7EDF1; --inc: #4B5A66; --inc-bg: #E1E6EA;
  --text: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", "Noto Sans", "Noto Sans Arabic", Tahoma, sans-serif;
  --data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Noto Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1219; --surface: #131D27; --sunken: #0F1820; --ink: #E6EDF4; --muted: #93A4B5; --line: #263443;
    --accent: #7DB4F5; --accent-ink: #07121D; --accent-bg: #16283F; --mark: #1F3A60;
    --band: #101B28; --band-ink: #F2F6FA; --band-muted: #A8BACD; --band-line: #24364A; --band-control: #18273A;
    --signal: #F2B544;
    --reg: #F08A7E; --reg-bg: #3A1C19; --imp: #6FD19B; --imp-bg: #15301F;
    --uns: #E9B955; --uns-bg: #36290E; --wrong: #B5A6E0; --wrong-bg: #262038;
    --ok: #50626F; --ok-bg: #1D2831; --inc: #A9B6C0; --inc-bg: #25313B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1219; --surface: #131D27; --sunken: #0F1820; --ink: #E6EDF4; --muted: #93A4B5; --line: #263443;
  --accent: #7DB4F5; --accent-ink: #07121D; --accent-bg: #16283F; --mark: #1F3A60;
  --band: #101B28; --band-ink: #F2F6FA; --band-muted: #A8BACD; --band-line: #24364A; --band-control: #18273A;
  --signal: #F2B544;
  --reg: #F08A7E; --reg-bg: #3A1C19; --imp: #6FD19B; --imp-bg: #15301F;
  --uns: #E9B955; --uns-bg: #36290E; --wrong: #B5A6E0; --wrong-bg: #262038;
  --ok: #50626F; --ok-bg: #1D2831; --inc: #A9B6C0; --inc-bg: #25313B; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--text); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1040px; margin-inline: auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.page { padding-block: 28px 64px; display: flex; flex-direction: column; gap: 40px; }
h1, h2, h3, p { margin: 0; }
h2 { font-size: 1.22rem; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
[dir="rtl"] h2, [dir="rtl"] .headline { letter-spacing: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
.num { font-family: var(--data); font-variant-numeric: tabular-nums; }

/* the band */
.band { background: var(--band); color: var(--band-ink); border-bottom: 1px solid var(--band-line); }
.band .wrap { padding-block: 22px 30px; display: flex; flex-direction: column; gap: 26px; }
header.top { display: flex; gap: 12px 24px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .logo { flex: none; color: var(--band-muted); }
.brand h1 { font-size: 0.98rem; font-weight: 600; letter-spacing: 0.01em; }
.lead { display: flex; flex-direction: column; gap: 12px; max-width: 46rem; min-width: 0; }
.headline { font-size: clamp(1.65rem, 1.15rem + 2.4vw, 2.6rem); line-height: 1.14; font-weight: 600; letter-spacing: -0.022em; text-wrap: balance; }
.band .tagline { color: var(--band-muted); font-size: 1.02rem; max-width: 40rem; }
.band .meta { color: var(--band-muted); display: flex; flex-direction: column; gap: 3px; overflow-wrap: anywhere; }

button { font: inherit; font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 13px; cursor: pointer; transition: border-color 0.12s, background-color 0.12s, color 0.12s; }
button:hover { border-color: var(--accent); }
/* The language button shows the name of the other language. When that name is Arabic, its own stack names
   the Arabic fonts that systems ship; with none of them the browser still uses any font that has the letters. */
#lang[lang="ar"] { font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, "Noto Sans Arabic", "Noto Naskh Arabic", "Geeza Pro", Arial, sans-serif; }
button:focus-visible, textarea:focus-visible, summary:focus-visible, .cell:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
/* controls that sit on the band itself */
.band header button, .band .source button, .band .source select { color: var(--band-ink); background: var(--band-control); border-color: var(--band-line); }
.band header button:hover, .band .source button:hover, .band .source select:hover { border-color: var(--band-muted); }
.band header button:focus-visible, .band .source button:focus-visible, .band .source select:focus-visible, .band details:not([open]) > summary:focus-visible { outline-color: var(--band-ink); }
.band .source button[aria-pressed="true"] { background: var(--band-ink); color: var(--band); border-color: var(--band-ink); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
textarea { font-family: var(--data); font-size: 0.82rem; width: 100%; min-height: 110px; padding: 10px; color: var(--ink);
  background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
code { font-family: var(--data); font-size: 0.86em; background: var(--sunken); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.note { border-inline-start: 3px solid var(--line); padding-inline-start: 12px; display: flex; flex-direction: column; gap: 4px; overflow-wrap: anywhere; }
main { display: flex; flex-direction: column; gap: 40px; min-width: 0; }
section { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 18px; display: flex; flex-direction: column; gap: 14px; }

/* the ledger: one tile for each state, and one cell for each case */
.board { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.ledger { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0; overflow: hidden; }
.tile { padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 3px; border-inline-end: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; min-width: 0; }
[dir="rtl"] .tile { margin: 0 0 -1px -1px; }
.tile .n { font-variant-numeric: tabular-nums; font-size: 2.7rem; font-weight: 600; line-height: 1.05; letter-spacing: -0.03em; }
.tile .k { font-weight: 600; display: flex; align-items: center; gap: 7px; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.s-reg { --c: var(--reg); --cb: var(--reg-bg); } .s-imp { --c: var(--imp); --cb: var(--imp-bg); }
.s-uns { --c: var(--uns); --cb: var(--uns-bg); } .s-wrong { --c: var(--wrong); --cb: var(--wrong-bg); }
.s-ok { --c: var(--ok); --cb: var(--ok-bg); } .s-chg { --c: var(--accent); --cb: var(--accent-bg); }
.s-inc { --c: var(--inc); --cb: var(--inc-bg); }
.dot, .cell { background: var(--c); }
.tile .n { color: var(--c); } .tile.s-ok .n { color: var(--muted); }
.map { border-top: 1px solid var(--line); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.strip { display: flex; flex-wrap: wrap; gap: 3px; }
.cell { width: 18px; height: 18px; border-radius: 4px; border: 0; padding: 0; cursor: default; }
button.cell { cursor: pointer; transition: transform 0.12s; } button.cell:hover { outline: 2px solid var(--ink); outline-offset: 1px; transform: scale(1.15); }
.cell.open { opacity: 0.5; }
.bar { display: flex; height: 18px; border-radius: 4px; overflow: hidden; gap: 2px; }
.bar .seg { background: var(--c); min-width: 3px; }
.more { margin-top: 4px; }

/* change against re-run variation: one scale, each rate with its interval under it */
.bars { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 14px 14px; align-items: center; }
.bars .lab { min-width: 0; font-weight: 500; }
.bars .plot { display: flex; flex-direction: column; gap: 4px; min-width: 40px; }
.bars .track { height: 16px; background: var(--sunken); border-radius: 4px; position: relative; }
.bars .fill { position: absolute; inset-block: 0; inset-inline-start: 0; border-start-end-radius: 4px; border-end-end-radius: 4px; background: var(--ok); min-width: 2px; }
.bars .fill.main { background: var(--accent); }
.bars .lane { height: 8px; position: relative; }
.bars .ci { position: absolute; inset-block: 0; border-inline: 2px solid var(--muted); min-width: 4px;
  background: linear-gradient(var(--muted), var(--muted)) center / 100% 2px no-repeat; }
.bars .axis { grid-column: 2; display: flex; justify-content: space-between; font-size: 0.74rem; color: var(--muted); margin-top: -8px; }
.bars .val .muted { font-size: 0.86em; }

.filters { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); align-self: flex-start; }
.filters button { padding: 4px 12px; font-size: 0.88rem; border-color: transparent; background: none; border-radius: 7px; }
.filters button:hover { background: var(--sunken); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.filters .count { font-family: var(--data); font-size: 0.86em; opacity: 0.7; margin-inline-start: 6px; }
.cards { display: flex; flex-direction: column; gap: 14px; }
.card { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 18px; display: flex; flex-direction: column; gap: 12px;
  scroll-margin-top: 16px; }
.card[hidden] { display: none; }
.card .head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.pill { font-size: 0.8rem; font-weight: 600; color: var(--c); background: var(--cb); border-radius: 999px; padding: 3px 11px 3px 9px; display: inline-flex; align-items: center; gap: 7px; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.card .q { font-size: 1.06rem; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.side { background: var(--sunken); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.side .lbl { font-size: 0.74rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
[dir="rtl"] .side .lbl { letter-spacing: 0; }
.side .ver { font-size: 0.8rem; color: var(--muted); overflow-wrap: anywhere; }
.side .ans { font-size: 0.97rem; line-height: 1.6; overflow-wrap: anywhere; white-space: pre-wrap; max-height: 18em; overflow-y: auto; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 1px 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.side .rerun { font-size: 0.82rem; color: var(--muted); overflow-wrap: anywhere; }
.side .rerun.diff { color: var(--uns); }
.side .rerun .num { font-family: var(--text); }
.score { font-size: 0.72rem; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 0 8px; white-space: nowrap; align-self: flex-start; }
.errs { font-size: 0.84rem; color: var(--muted); overflow-wrap: anywhere; }
details.ctx > summary { cursor: pointer; font-size: 0.9rem; font-weight: 500; }
.ctxgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; padding-top: 10px; }
.ctxgrid ul { margin: 0; padding-inline-start: 16px; font-size: 0.84rem; display: flex; flex-direction: column; gap: 3px; }
.ctxgrid li { overflow-wrap: anywhere; }
.tag { font-size: 0.72rem; border: 1px solid var(--wrong); color: var(--wrong); border-radius: 999px; padding: 0 8px; }
.judge { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; }
.judge button { padding: 4px 12px; font-size: 0.88rem; }
details.wrongs > summary { cursor: pointer; font-weight: 500; }
details.wrongs ul { margin: 10px 0 0; padding-inline-start: 18px; font-size: 0.9rem; display: flex; flex-direction: column; gap: 4px; }
details.wrongs li { overflow-wrap: anywhere; }
.cross { overflow-x: auto; }
.cross table { border-collapse: collapse; font-size: 0.9rem; min-width: 100%; }
.cross th, .cross td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: end; vertical-align: bottom; }
.cross th { font-weight: 500; color: var(--muted); font-size: 0.82rem; }
.cross th[scope="row"], .cross thead th:first-child { text-align: start; }
.cross th[scope="row"] { color: var(--ink); font-size: 0.9rem; white-space: nowrap; }
.cross td { font-family: var(--data); font-variant-numeric: tabular-nums; }
.cross .dot { display: inline-block; margin-inline-end: 7px; }
.cross td.zero { color: var(--muted); opacity: 0.55; }
.cross td.read span { background: var(--accent-bg); color: var(--ink); font-weight: 600; border-radius: 6px; padding: 2px 8px; margin-inline-end: -8px; }
.cross tr:last-child th, .cross tr:last-child td { border-bottom: 0; }
.closing { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.closing section { border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.closing h2 { font-size: 1.02rem; }
.limits ul, .get ul { margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 8px; }
.foot { border-top: 1px solid var(--line); padding-top: 16px; }
.out { display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 560px) {
  .bars { grid-template-columns: minmax(0, 1fr); gap: 4px 0; } .bars .val { margin-bottom: 10px; } .bars .axis { grid-column: 1; margin-top: -4px; }
  .tile .n { font-size: 2.2rem; } .page { gap: 32px; } main { gap: 32px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
@media (prefers-reduced-motion: reduce) { button, button.cell { transition: none; } button.cell:hover { transform: none; } }
@media print { button, .filters, .out { display: none !important; } body { background: #fff; } .band { background: none; color: #000; border-bottom: 1px solid #999; }
  .band .tagline, .band .meta, .brand .logo { color: #333; } }
/* Inputs of the browser version. The report itself uses the stylesheet of report_template.html. */
.inputs { display: flex; flex-direction: column; gap: 14px; }
.source { gap: 10px 16px; }
.source > label { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; max-width: 100%; color: var(--band-muted); }
.source > label select { min-width: 0; }
.seg { display: inline-flex; flex-wrap: wrap; }
.seg button { border-radius: 0; }
.seg button + button { margin-inline-start: -1px; }
.seg button:first-child { border-start-start-radius: 8px; border-end-start-radius: 8px; }
.seg button:last-child { border-start-end-radius: 8px; border-end-end-radius: 8px; }
.seg button[aria-pressed="true"] { position: relative; }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; max-width: 100%; }
select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* two disclosures that sit side by side as buttons while closed; an open one takes the whole row as a sheet */
.panels { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
details.own { border: 1px solid var(--band-line); border-radius: 10px; background: var(--band-control); color: var(--band-ink); min-width: 0; max-width: 100%; }
details.own > summary { cursor: pointer; padding: 8px 14px; font-weight: 500; list-style: none; display: flex; align-items: center; gap: 10px; border-radius: 9px; }
details.own > summary::-webkit-details-marker { display: none; }
details.own > summary::after { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
  transform: translateY(-2px) rotate(45deg); flex: none; opacity: 0.8; }
details.own[open] > summary::after { transform: translateY(2px) rotate(-135deg); }
details#own:not([open]) { background: var(--band-ink); color: var(--band); border-color: var(--band-ink); }
details.own[open] { flex-basis: 100%; background: var(--surface); color: var(--ink); border-color: var(--line); }
details.own[open] > summary { font-weight: 600; padding-block: 14px 8px; padding-inline: 18px; }
details.own .body { padding: 4px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
details.own ol { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 8px; max-width: 78ch; }
.drop { border: 1.5px dashed var(--line); border-radius: 10px; background: var(--sunken); padding: 16px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.drop.over { border-color: var(--accent); background: var(--accent-bg); }
.filebtn { font: inherit; font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 13px; cursor: pointer;
  position: relative; display: inline-block; }
.filebtn:hover { border-color: var(--accent); }
.filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.cols { margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 4px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 16px; }
.opts label { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.msg { border: 1px solid var(--reg); background: var(--reg-bg); color: var(--ink); border-radius: 8px; padding: 10px 12px; overflow-wrap: anywhere; }
.warn { color: var(--uns); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); padding-inline: 20px; }
button.done { border-color: var(--accent); font-weight: 600; }
/* Only the tool header/footer and add-on data selector are new; existing report CSS stays intact. */
.tool-links{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--band-line);padding:0 0 15px}
.tool-links a{color:var(--band-ink);font-size:.84rem;font-weight:600;text-decoration:none;border-radius:6px;padding:4px 7px}
.tool-links a:hover{text-decoration:underline;color:#9deadd}
.tool-privacy-label{margin-inline-start:auto;font-size:.75rem;color:var(--band-muted)}
.preset-status{font-size:.78rem;color:var(--band-muted);max-width:46rem}
.preset-status:empty{display:none}
.preset-status.error{color:#f3b8aa}
.tool-footer{border-top:1px solid var(--line);padding:23px 2px 10px;display:flex;gap:14px 28px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.tool-footer a{color:var(--accent)}
.tool-footer-links{display:flex;gap:8px 15px;flex-wrap:wrap}
.preset-origin{display:inline-block;color:var(--muted);font-size:.81rem;max-width:70rem}
.preset-origin a{color:var(--accent)}
@media(max-width:600px){.tool-privacy-label{flex-basis:100%;margin-inline-start:0}.tool-footer{align-items:flex-start;flex-direction:column}}
</style>
<!--/page-->
</head>
<body>
<!--page-->
<div id="app">
  <div class="band"><div class="wrap">
    <nav class="tool-links" aria-label="RIDI site navigation">
      <a href="../index.html" id="tool-overview-link">&#8592; RIDI Check overview</a>
      <a href="../research.html" id="tool-research-link">Research &amp; evidence</a>
      <a href="https://github.com/adeebnoor/ridi-check" target="_blank" rel="noopener noreferrer">GitHub &#8599;</a>
      <span class="tool-privacy-label" id="tool-local-label">Your files are processed in this browser</span>
    </nav>
    <header class="top">
      <div class="brand"><svg class="logo" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="8.5" height="8.5" rx="2.2" fill="currentColor"/><rect x="12.5" y="1" width="8.5" height="8.5" rx="2.2" fill="currentColor"/><rect x="1" y="12.5" width="8.5" height="8.5" rx="2.2" fill="currentColor"/><rect x="12.5" y="12.5" width="8.5" height="8.5" rx="2.2" fill="var(--signal)"/></svg><h1 id="t-name">RIDI Update Check</h1></div>
      <button type="button" id="lang" lang="ar">العربية</button>
    </header>
    <div class="lead">
      <p class="headline" id="t-headline"></p>
      <p class="tagline" id="t-tagline"></p>
    </div>
    <div class="inputs">

<script>
/* ridi-check analysis for the browser. A line-for-line port of contract.py, analysis.py and the data
   part of report.py. tests/test_web.py runs this file in Node against the Python on random files:
   change both together. */
const RidiCore = (function () {
  "use strict";
  const KEY = "key", NOKEY = "nokey";
  const RUN_COLUMN = /^(baseline|updated)(?:_repeat([0-9]*))?_(answer|correct)$/;
  const KEY_STATES = ["stable_regression", "stable_improvement", "regression_unconfirmed", "improvement_unconfirmed",
    "unstable", "wrong_both", "correct_both", "incomplete"];
  const NOKEY_STATES = ["stable_change", "change_unconfirmed", "unstable", "same", "incomplete"];
  const UNCHANGED = new Set(["correct_both", "same"]);
  /* answer-key mode: what the answer text of a case did, whatever its score did */
  const ANSWER_STATES = ["stable_change", "change_unconfirmed", "unstable", "same", "no_answer_text"];
  const NEGATIONS = new Set("not no never neither nor without none cannot t لا غير لم لن بدون ليس ليست".split(" "));
  const CSS_CLASS = { stable_regression: "s-reg", regression_unconfirmed: "s-reg", stable_improvement: "s-imp",
    improvement_unconfirmed: "s-imp", stable_change: "s-chg", change_unconfirmed: "s-chg", unstable: "s-uns",
    wrong_both: "s-wrong", correct_both: "s-ok", same: "s-ok", incomplete: "s-inc" };

  function RidiError(code, info) { const e = new Error(code); e.code = code; e.info = info || {}; return e; }
  const strip = (s) => String(s).replace(/^\s+|\s+$/g, "");

  /* ---------- reading ---------- */
  function sniffDelimiter(text) {
    if (!/\S/.test(text)) return ",";
    text = text.replace(/^﻿+/, "");
    const end = /[\r\n]/.exec(text), header = end ? text.slice(0, end.index) : text;   /* the first line only: the text is not split */
    if (!header.includes(",")) { if (header.includes("\t")) return "\t"; if (header.includes(";")) return ";"; }
    return ",";
  }
  /* Same behaviour as Python's csv.reader with skipinitialspace=True. One record at a time, as [row number, cells],
     blank records left out. A cell is cut out of the text in one piece where it can be, instead of being built up
     character by character, so a large file does not leave a copy of itself behind as it is read. */
  function* iterRecords(text) {
    text = String(text).replace(/^﻿+/, "");
    const delim = sniffDelimiter(text).charCodeAt(0), n = text.length;
    const unguard = (cell) => (cell.length > 1 && cell[0] === "'" && "=+-@\t\r".indexOf(cell[1]) >= 0 ? cell.slice(1) : cell);
    const blank = (cell) => strip(cell) === "";
    let row = [], cur = "", seg = -1, state = 0; /* 0 start of field, 1 in field, 2 in quotes, 3 quote seen inside quotes */
    let started = false, index = 0;
    /* seg: where the piece of the field that is being read began, or -1 when there is none */
    const take = (i) => { if (seg >= 0) { cur = cur === "" ? text.slice(seg, i) : cur + text.slice(seg, i); seg = -1; } };
    const endField = (i) => { take(i); row.push(cur); cur = ""; };
    for (let i = 0; i < n; i++) {
      const c = text.charCodeAt(i);
      if ((c === 10 || c === 13) && state !== 2) {
        const at = i;
        if (c === 13 && text.charCodeAt(i + 1) === 10) i++;
        if (started) endField(at);
        index++;
        if (!row.every(blank)) yield [index, row.map(unguard)];
        row = []; started = false; state = 0;
        continue;
      }
      started = true;
      if (state === 0) {
        if (c === 34) { state = 2; seg = i + 1; }
        else if (c === 32) { /* skipped */ }
        else if (c === delim) endField(i);
        else { seg = i; state = 1; }
      } else if (state === 1) {
        if (c === delim) { endField(i); state = 0; }
      } else if (state === 2) {
        if (c === 34) { take(i); state = 3; }
      } else {
        if (c === 34) { seg = i; state = 2; }             /* a doubled quote: the second one is text */
        else if (c === delim) { endField(i); state = 0; }
        else { seg = i; state = 1; }
      }
    }
    if (started) { endField(n); index++; if (!row.every(blank)) yield [index, row.map(unguard)]; }
  }
  const readRecords = (text) => Array.from(iterRecords(text));
  function runColumn(side, run, kind) {
    return run === 1 ? side + "_" + kind : run === 2 ? side + "_repeat_" + kind : side + "_repeat" + (run - 1) + "_" + kind;
  }
  const splitContext = (cell) => cell.split("|").map(strip).filter(Boolean);

  const PLAIN_NUMBER = /^[+-]?(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$/;
  function parseResults(text, mode) {

    /* one record at a time: the rows of a large file are not all held while its cases are built */
    const records = iterRecords(text), first = records.next(), second = records.next();
    if (first.done || second.done) throw RidiError("empty");
    const header = first.value[1].map((h) => strip(h).toLowerCase());
    const seen = new Set();
    for (const name of header) { if (name && seen.has(name)) throw RidiError("dupColumn", { name }); seen.add(name); }
    const col = {}; header.forEach((name, i) => { col[name] = i; });
    if (!("case_id" in col)) throw RidiError("noId");

    const runs = {}; /* "side|kind" -> [[index, position]] in header order */
    header.forEach((name, position) => {
      const m = RUN_COLUMN.exec(name); if (!m) return;

      else if (m[2] === "") index = 1;
      else { index = parseInt(m[2], 10); if (index < 1) throw RidiError("repeatZero", { name }); }
      const slot = runs[m[1] + "|" + m[3]] = runs[m[1] + "|" + m[3]] || [];
      const clash = slot.find((x) => x[0] === index);
      if (clash) throw RidiError("sameRun", { a: header[clash[1]], b: name });
      slot.push([index, position]);
    });
    const hasKey = "baseline_correct" in col && "updated_correct" in col;
    const hasAnswers = "baseline_answer" in col && "updated_answer" in col;
    if (!hasKey && !hasAnswers) throw RidiError("needCols");
    if (mode === KEY && !hasKey) throw RidiError("needKey");
    if (mode === NOKEY && !hasAnswers) throw RidiError("needAnswers");
    const resolved = mode !== "auto" ? mode : (hasKey ? KEY : NOKEY), key = resolved === KEY;

    const cases = [], firstRow = new Map();
    for (let next = second; !next.done; next = records.next()) {
      const row = next.value[0], record = next.value[1];
      const at = (i) => (i >= 0 && i < record.length ? strip(record[i]) : "");
      const get = (name) => at(name in col ? col[name] : -1);
      const id = get("case_id");
      if (!id) throw RidiError("rowNoId", { row });
      if (firstRow.has(id)) throw RidiError("rowDup", { row, id, first: firstRow.get(id) });
      firstRow.set(id, row);
      const c = { id, row, q: get("question"), expected: get("expected"), b: [], u: [],
        bc: splitContext(get("baseline_context")), uc: splitContext(get("updated_context")), err: get("run_errors"), incomplete: false };
      /* optional scores and content hashes, one for each passage, "-" for none */
      const aligned = (column, passages, numbers) => {
        const cell = get(column);
        if (strip(cell) === "") return [];
        const values = cell.split("|").map(strip);
        if (values.length !== passages.length) throw RidiError("ctxCount", { row, id, col: column, got: values.length, want: passages.length });
        return values.map((v) => {
          if (v === "" || v === "-") return null;
          if (!numbers) return v;
          if (!PLAIN_NUMBER.test(v)) throw RidiError("ctxNumber", { row, id, col: column, value: v });
          return parseFloat(v);
        });
      };
      c.bs = aligned("baseline_context_scores", c.bc, true); c.us = aligned("updated_context_scores", c.uc, true);
      c.bh = aligned("baseline_context_hashes", c.bc, false); c.uh = aligned("updated_context_hashes", c.uc, false);
      const sameText = new Map();   /* runs that repeat an answer share one copy of it */
      for (const side of ["baseline", "updated"]) {
        const answers = new Map(runs[side + "|answer"] || []), corrects = runs[side + "|correct"] || [];
        const scored = new Map();
        for (const [index, position] of corrects) {
          const v = at(position);
          if (v === "") scored.set(index, null);
          else if (v !== "0" && v !== "1") throw RidiError("rowBin", { row, id, col: header[position], value: v });
          else scored.set(index, +v);
        }
        const indices = Array.from(new Set([...answers.keys(), ...(key ? corrects.map((x) => x[0]) : [])])).sort((a, b) => a - b);
        const out = [];
        for (const index of indices) {
          let ans = answers.has(index) ? at(answers.get(index)) : "";
          if (sameText.has(ans)) ans = sameText.get(ans); else sameText.set(ans, ans);
          const cor = key && scored.has(index) ? scored.get(index) : null;
          const missing = key ? cor === null : ans === "";
          if (index === 0) {
            if (missing) {
              if (!c.err) throw RidiError("rowEmptyFirst", { row, id, col: runColumn(side, 1, key ? "correct" : "answer") });
              c.incomplete = true; continue;
            }
          } else if (ans === "" && cor === null) continue;
          else if (key && cor === null) throw RidiError("rowNoCorrect", { row, id, a: runColumn(side, index + 1, "answer"), c: runColumn(side, index + 1, "correct") });
          out.push({ ans, cor });
        }
        c[side === "baseline" ? "b" : "u"] = out;
      }
      cases.push(c);
    }
    return { cases, mode: resolved };
  }

  /* ---------- analysis ---------- */
  /* Lower-case, punctuation to spaces, whitespace collapsed, except that the signs that carry meaning are kept,
     each as a word of its own: every mathematical symbol, a percent sign after a digit, "/" and "*" between two
     letters or digits, "!" before "=", and a hyphen that is a sign (-5, HIV-). Same rules as analysis.py. */
  /* What a character is, worked out once for each character ever seen: "d" a digit, "w" another letter or
     number, "m" a mathematical, currency or other symbol, "" anything else. */
  const KIND = new Map();
  function kind(c) {
    if (c === undefined) return "";
    let k = KIND.get(c);
    if (k === undefined) { k = /\p{Nd}/u.test(c) ? "d" : /[\p{L}\p{N}]/u.test(c) ? "w" : /[\p{Sm}\p{Sc}\p{So}]/u.test(c) ? "m" : ""; KIND.set(c, k); }
    return k;
  }
  function normalise(text, keepCase) {
    const s = Array.from(keepCase ? String(text) : String(text).toLowerCase());
    let out = "";
    for (let i = 0; i < s.length; i++) {
      const ch = s[i], k = kind(ch);
      if (k === "d" || k === "w") { out += ch; continue; }
      const before = kind(s[i - 1]), after = kind(s[i + 1]), wordBefore = before === "d" || before === "w", wordAfter = after === "d" || after === "w";
      if ((ch === "." || ch === "," || ch === "\u066b" || ch === "\u066c") && before === "d" && after === "d") { out += ch; continue; }
      const keep = k === "m" || ((ch === "%" || ch === "\u066a") && before === "d") ||
        ((ch === "/" || ch === "*") && wordBefore && wordAfter) ||
        (ch === "-" && ((after === "d" && !wordBefore) || (wordBefore && !wordAfter))) || (ch === "!" && s[i + 1] === "=");
      out += keep ? " " + (ch === "\u2212" ? "-" : ch) + " " : " ";
    }
    return out.replace(/\s+/g, " ").trim();
  }
  function sameAnswer(a, b, threshold) {
    if (a === b) return true;     /* the same text: nothing to work out */
    const x = normalise(a), y = normalise(b);
    if (x === y) return true;
    if (!(threshold < 1)) return false;
    const xs = x.split(" "), ys = y.split(" ");
    const A = new Set(xs), B = new Set(ys);
    const neg = (S) => { for (const w of S) if (NEGATIONS.has(w)) return true; return false; };
    if (neg(A) !== neg(B)) return false;
    const nums = (s) => (s.match(/\p{Nd}+/gu) || []).join(" ");   /* the digit runs, in order: "5mg" and "50mg" differ */
    if (nums(x) !== nums(y)) return false;
    /* the signs that were kept must be the same, in the same order */
    const signs = (ws) => ws.filter((w) => w !== "" && !/[\p{L}\p{N}]/u.test(Array.from(w)[0])).join(" ");
    if (signs(xs) !== signs(ys)) return false;
    /* every word that holds a digit; a bare number is taken together with the word after it (its unit) */
    const contexts = (ws) => ws.map((w, i) => (/\p{Nd}/u.test(w) ? w + " " + (/^\p{Nd}+$/u.test(w) && i + 1 < ws.length ? ws[i + 1] : "") : null)).filter((c) => c !== null).join("|");
    if (contexts(xs) !== contexts(ys)) return false;
    /* the same number of words and not the same text: a word was replaced, or the same words stand in another order */
    if (xs.length === ys.length) return false;
    let shared = 0; A.forEach((w) => { if (B.has(w)) shared++; });
    const union = A.size + B.size - shared;
    return union > 0 && shared / union >= threshold;
  }
  const makeEq = (mode, threshold) => (mode === KEY ? (r, s) => r.cor === s.cor : (r, s) => sameAnswer(r.ans, s.ans, threshold));
  function classify(c, mode, threshold) {
    if (c.incomplete) return "incomplete";
    const eq = makeEq(mode, threshold), b = c.b, u = c.u;
    if (!b.every((r) => eq(r, b[0])) || !u.every((r) => eq(r, u[0]))) return "unstable";
    const key = mode === KEY;
    if (eq(b[0], u[0])) return !key ? "same" : (b[0].cor ? "correct_both" : "wrong_both");
    const confirmed = b.length > 1 && u.length > 1;
    if (!key) return confirmed ? "stable_change" : "change_unconfirmed";
    if (b[0].cor) return confirmed ? "stable_regression" : "regression_unconfirmed";
    return confirmed ? "stable_improvement" : "improvement_unconfirmed";
  }
  function analyse(cases, mode, threshold) {
    threshold = threshold === undefined ? 1 : threshold;
    const key = mode === KEY, eq = makeEq(mode, threshold);
    const a = { mode, threshold, items: [], counts: {}, answerChange: {}, answerState: {}, sameTextScored: [], bySimilarity: [], caseOnly: [], n: cases.length, nCompared: 0, changed: 0,
      rerunB: 0, rerunBN: 0, rerunU: 0, rerunUN: 0, anyB: 0, anyU: 0, confirmable: 0, maxRunsB: 0, maxRunsU: 0,
      correctB: 0, correctU: 0, regressions: 0, improvements: 0 };
    (key ? KEY_STATES : NOKEY_STATES).forEach((s) => { a.counts[s] = 0; });
    for (const c of cases) {
      const s = classify(c, mode, threshold);
      a.counts[s]++; a.items.push({ c, s });
      if (s === "incomplete") continue;
      const b = c.b, u = c.u;
      a.nCompared++; a.maxRunsB = Math.max(a.maxRunsB, b.length); a.maxRunsU = Math.max(a.maxRunsU, u.length);
      if (!eq(b[0], u[0])) a.changed++;
      if (b.length > 1) { a.rerunBN++; if (!eq(b[0], b[1])) a.rerunB++; if (!b.every((r) => eq(r, b[0]))) a.anyB++; }
      if (u.length > 1) { a.rerunUN++; if (!eq(u[0], u[1])) a.rerunU++; if (!u.every((r) => eq(r, u[0]))) a.anyU++; }
      if (key) {
        const all = b.concat(u), byAnswer = all.every((r) => r.ans) ? classify(c, NOKEY, threshold) : "no_answer_text";
        if (byAnswer !== "same") a.answerState[c.id] = byAnswer;
        if (s === "wrong_both" || s === "correct_both") {
          if (byAnswer === "stable_change") a.answerChange[c.id] = "stable";
          else if (byAnswer === "change_unconfirmed") a.answerChange[c.id] = "unconfirmed";
          else if (byAnswer === "unstable") a.answerChange[c.id] = "varied";
        }
        /* one answer text with two scores: the scoring is not consistent */
        const scored = new Map();

        '%"></span></span><span class="lane">' + (x.w ? '<span class="ci" style="inset-inline-start:' + (100 * x.w.lo / top) + "%;width:" + (100 * (x.w.hi - x.w.lo) / top) + '%"></span>' : "") +
        '</span></span><span class="val num">' + fmt(p) + '% <span class="muted">(' + esc(t("of", { k: x.r.count, n: x.r.n }) + (x.w ? t("interval95", { a: fmt(x.w.lo), b: fmt(x.w.hi) }) : "")) + ")</span></span>"; };
    h += "<section><h2>" + esc(t("rates")) + '</h2><div class="panel"><div class="bars">' + rates.map(bar).join("") +
      '<span class="axis num" aria-hidden="true"><span>0%</span><span>' + fmt(top / 2) + "%</span><span>" + top + "%</span></span>";
    h += '</div><p class="small muted">' + esc(t("intervalNote")) + "</p><p>";
    if (pB === null || pU === null) h += esc(t("rateNone"));
    else if (pT <= Math.max(pB, pU)) h += esc(t("rateWithin"));
    else h += esc(t("rateAbove", { t: fmt(pT), b: fmt(pB), u: fmt(pU) }));
    h += "</p>";
    if (D.acc) {
      const d = pct(D.acc.b, D.acc.n) - pct(D.acc.a, D.acc.n);
      h += '<p class="small muted">' + esc(t("acc", { a: fmt(pct(D.acc.a, D.acc.n)), b: fmt(pct(D.acc.b, D.acc.n)), d: (d > 0 ? "+" : d < 0 ? "−" : "") + fmt(Math.abs(d)), r: D.acc.r, i: D.acc.i })) + "</p>";
      if (D.acc.n >= 3 && !D.acc.a && !D.acc.b) h += '<p class="small warn">' + esc(t("noneCorrect")) + "</p>";
      const c = 2 * Math.min(D.acc.r, D.acc.i);
      if (c) h += '<p class="small muted">' + esc(t("masked", { m: D.acc.r + D.acc.i, v: Math.abs(D.acc.i - D.acc.r), c })) + "</p>";
    }
    if (D.summary.passages) { const P = D.summary.passages, F = P.by_state[D.focus];
      h += '<p class="small muted">' + esc((P.differ === P.cases_with_passages && P.cases_with_passages > 1 ? t("passagesAll", { n: P.cases_with_passages })
        : !P.differ ? t(P.cases_with_passages === 1 ? "passagesNoneOne" : "passagesNone", { n: P.cases_with_passages })
        : t("passages", { k: P.differ, n: P.cases_with_passages }) + (F ? t("passagesFocus", { k: F.differ, n: F.n }) : "") + t("passagesNote")) + (P.reordered ? t("passagesOrder", { r: P.reordered }) : "") + (P.content_changed ? t("passagesContent", { r: P.content_changed }) : "")) + "</p>"; }
    if ((D.summary.differ_only_in_letter_case || []).length) { const ids = D.summary.differ_only_in_letter_case;
      h += '<p class="small muted">' + esc(t("caseOnly", { n: ids.length, ids: ids.slice(0, 20).join(", ") + (ids.length > 20 ? ", …" : "") })) + "</p>"; }
    if ((D.summary.labelled_by_similarity || []).length) { const ids = D.summary.labelled_by_similarity;
      h += '<p class="small muted">' + esc(t("bySimilarity", { n: ids.length, ids: ids.slice(0, 20).join(", ") + (ids.length > 20 ? ", …" : "") })) + "</p>"; }
    h += '<p class="small muted">' + esc(t("rateFirst")) + (Math.max(S.runs_per_version.current, S.runs_per_version.proposed) > 2
      ? " " + esc(t("anyRun", { b: S.any_run_disagreement.current, u: S.any_run_disagreement.proposed })) : "") + "</p></div></section>";
    h += crossHTML();

    const inView = { all: D.cards.length, stable: D.cards.filter(isStable).length, uns: D.cards.filter((c) => c.state === "unstable" || c.flag === "varied").length };
    h += "<section><h2>" + esc(t("review")) + '</h2><div class="filters">' +
      [["all", "fAll"], ["stable", "fStable"], ["uns", "fUns"]].map((f) => '<button type="button" data-filter="' + f[0] + '">' + esc(t(f[1])) + '<span class="count">' + inView[f[0]] + "</span></button>").join("") + "</div>" +
      (D.cards.some((c) => c.b.length && c.u.length && c.b[0].ans && c.u[0].ans && c.b[0].ans !== c.u[0].ans) ? '<p class="small muted">' + esc(t("diffNote")) + "</p>" : "") +
      '<div class="cards" id="cards"></div>';
    if (KEYM && D.wrong.length) {
      const flagged = D.wrong.filter((w) => w[2]).length;
      h += '<details class="wrongs panel" data-k="wrongs"><summary>' + esc(t("wrongList", { n: D.wrong.length })) + '</summary><p class="small muted" style="padding-top:8px">' + esc(t("wrongNote")) +
        (flagged ? " " + esc(t("wrongChanged", { n: flagged })) : "") + (D.wrong.length > LIST_MAX ? " " + esc(t("wrongMore", { a: LIST_MAX, n: D.wrong.length })) : "") + "</p><ul>" + D.wrong.slice(0, LIST_MAX).map((w) => '<li><span class="num muted">' + esc(w[0]) + '</span> <span dir="auto">' + esc(w[1]) + "</span>" +
        (w[2] ? ' <span class="tag">' + esc(L().pill["wrong_both" + (w[2] === "stable" ? "_changed" : w[2] === "varied" ? "_varied" : "_changed_unconfirmed")]) + "</span>" : "") + "</li>").join("") + "</ul></details>";
    }
    h += '<div class="out"><div class="row">' + (!KEYM && D.stable_change_ids.length ? '<button type="button" id="copy-j">' + esc(u("copyJ")) + '</button><button type="button" id="forget">' + esc(u("forget")) + "</button>" : "") +
      (D.cards.length || D.wrong.length ? '<button type="button" id="copy-r">' + esc(u("copyR")) + "</button>" : "") +
      '<span class="small muted" id="copy-msg" role="status"></span></div><textarea id="csv-out" hidden readonly dir="ltr" aria-label="CSV"></textarea></div></section>';
    return h;
  }

  /* ---------- page ---------- */
  function render() {
    const open = Array.from(document.querySelectorAll("details[open][data-k]")).map((d) => d.dataset.k);
    const app = $("app");
    document.documentElement.lang = state.lang; app.dir = state.lang === "ar" ? "rtl" : "ltr";
    $("t-name").textContent = u("name"); $("t-headline").textContent = t("headline"); $("t-drop").textContent = u("drop"); $("lang").textContent = u("langBtn"); $("lang").lang = state.lang === "ar" ? "en" : "ar"; $("t-tagline").textContent = u("tagline");
    $("btn-sample-key").textContent = u("sampleKey"); $("btn-sample-nokey").textContent = u("sampleNoKey");
    $("t-set-label").textContent = u("setLabel"); $("opt-set-library").textContent = u("setLibrary"); $("opt-set-medicines").textContent = u("setMedicines");
    $("opt-set-qwen-config").textContent = state.lang === "ar"
      ? "Qwen2.5 1.5B - تحديث التعليمات (بيانات موقعة، 48 حالة)"
      : "Qwen2.5 1.5B - prompt update (signed run, 48 cases)";
    $("opt-set-qwen-swap").textContent = state.lang === "ar"
      ? "Qwen2.5 0.5B مقابل 1.5B - استبدال نموذج (بيانات موقعة، 48 حالة)"
      : "Qwen2.5 0.5B to 1.5B - model swap (signed run, 48 cases)";
    $("tool-overview-link").textContent = state.lang === "ar" ? "العودة إلى RIDI Check" : "Back to RIDI Check overview";
    $("tool-research-link").textContent = state.lang === "ar" ? "البحث والأدلة" : "Research & evidence";
    $("tool-local-label").textContent = state.lang === "ar"
      ? "ملفاتك تُحلل داخل المتصفح، والتجارب العامة تُجلب فقط عند اختيارها"
      : "Your uploads stay in-browser; public preset CSVs load only when selected";
    $("sample-set").value = state.set;
    $("t-why").textContent = u("whyTitle"); $("t-why-list").innerHTML = UI[state.lang].whyList.map((x) => "<li>" + esc(x) + "</li>").join("");
    $("btn-sample-key").setAttribute("aria-pressed", state.source === "sample-key");
    $("btn-sample-nokey").setAttribute("aria-pressed", state.source === "sample-nokey");
    $("t-own").textContent = u("own"); $("t-choose").textContent = u("choose"); $("t-paste").textContent = u("paste"); $("btn-run").textContent = u("run");
    $("t-privacy").textContent = u("privacy"); $("t-format").textContent = u("format"); $("t-cols-note").textContent = u("colsNote");
    $("t-cols").innerHTML = UI[state.lang].cols.map((x) => "<li>" + x + "</li>").join("");
    $("t-opts").textContent = u("opts"); $("t-mode-label").textContent = u("modeLabel"); $("t-sim-label").textContent = u("sameWhen");
    $("opt-auto").textContent = u("modeAuto"); $("opt-nokey").textContent = u("modeNoKey");
    $("opt-sim1").textContent = u("simExact"); $("opt-sim90").textContent = u("sim90"); $("opt-sim75").textContent = u("sim75");
    $("mode").value = state.modePref; $("sim").value = String(state.sim);
    $("t-get").textContent = u("getTitle"); $("t-get-list").innerHTML = UI[state.lang].getList.map((x) => "<li>" + esc(x) + "</li>").join("");
    if (state.errorCode) state.error = fill(UI[state.lang].err[state.errorCode.code] || UI[state.lang].err.read, state.errorCode.info);
    const err = $("err"); err.hidden = !state.error; err.textContent = state.error || "";
    if (!state.D) { $("report").innerHTML = ""; return; }
    const realPresetSelected = Boolean(REPRODUCIBLE_PRESETS[state.set]) && state.source !== "file";
    // Do not put the misleading "fictional library example" label on an actual signed Qwen run.
    let note = realPresetSelected ? "" : ("<span>" + esc(state.source === "sample-key" ? u(state.set === "medicines" ? "noteKeyMed" : "noteKey") : state.source === "sample-nokey" ? u(state.set === "medicines" ? "noteNoKeyMed" : "noteNoKey") : u(state.A.n === 1 ? "noteFileOne" : "noteFile", { n: state.A.n })) + "</span>");
    note += "<span>" + esc(state.mode === "key" ? t("modeNote") : t("modeNote", { rule: state.sim >= 1 ? t("simExact") : t("simWords", { p: fmt(state.sim * 100) }) })) + "</span>";
    if (REPRODUCIBLE_PRESETS[state.set] && state.source !== "file") {
      const meta = REPRODUCIBLE_PRESETS[state.set];
      const scope = state.lang === "ar"
        ? "نتائج نموذج حقيقي من تشغيل GitHub الموقّع. التقييم وفق تسميات BoolQ المنشورة، وليس تحكيماً طبياً أو بشرياً جديداً. قد تتعارض بعض التسميات مع النص أو الزمن. المصدر: "
        : "Real model outputs from the signed GitHub CPU run. Scores use published BoolQ labels, not new independent human/medical adjudication; some labels conflict with the passage or time. Source: ";
      note += '<span class="preset-origin">' + esc(scope) +
        '<a href="' + meta.run + '" target="_blank" rel="noopener noreferrer">' + esc(meta.label) + '</a></span>';
    }
    $("source-note").innerHTML = note;
    $("t-limits").textContent = t("limits"); $("t-limit-list").innerHTML = L().limitList.map((x) => "<li>" + esc(x) + "</li>").join("");
    $("report").innerHTML = reportHTML();
    open.forEach((k) => { const d = Array.from(document.querySelectorAll("details[data-k]")).find((x) => x.dataset.k === k); if (d) d.open = true; });
    applyFilter();
  }
  function copyOut(text, button) {
    const msg = $("copy-msg"), out = $("csv-out");
    const fail = () => { out.hidden = false; out.value = text; out.focus(); out.select(); msg.textContent = u("copyFail"); };
    const done = () => {
      msg.textContent = u("copied"); out.hidden = false; out.value = text;
      const label = button.textContent;                 /* the button itself says so for two seconds */
      button.textContent = "\u2713 " + u("copied"); button.classList.add("done");
      setTimeout(() => { if (button.isConnected) { button.textContent = label; button.classList.remove("done"); } }, 2000);
    };
    try { navigator.clipboard.writeText(text).then(done, fail); } catch (e) { fail(); }
  }

  $("lang").addEventListener("click", () => { state.lang = state.lang === "ar" ? "en" : "ar"; store.set("ridi-lang", state.lang); render(); });
  $("btn-sample-key").addEventListener("click", () => { state.errorCode = null; load("sample-key", SAMPLES[state.set]); });
  $("btn-sample-nokey").addEventListener("click", () => { state.errorCode = null; load("sample-nokey", SAMPLES[state.set]); });
  function setPresetStatus(message, isError) {
    const node = $("preset-status");
    node.textContent = message || "";
    node.classList.toggle("error", !!isError);
  }
  function storePresetInUrl(name) {
    try {
      const url = new URL(location.href);
      url.searchParams.set("preset", name);
      history.replaceState(null, "", url.pathname + url.search + url.hash);
    } catch (_) { /* File URLs and locked-down browsers may reject history writes. */ }
  }
  async function choosePreset(name, { deepLink = false } = {}) {
    const token = ++activePresetRequest;
    if (Object.prototype.hasOwnProperty.call(SAMPLES, name)) {
      state.set = name;
      state.errorCode = null;
      load(state.source === "sample-nokey" ? "sample-nokey" : "sample-key", SAMPLES[name]);
      setPresetStatus("", false);
      if (!deepLink) storePresetInUrl(name);
      return;
    }
    const spec = REPRODUCIBLE_PRESETS[name];
    if (!spec) {
      // Fail explicitly instead of inventing a medical benchmark or silently loading fake drug names.
      const unsupported = name === "clinical_ddi" || name === "counterfactual_med";
      const message = unsupported
        ? (state.lang === "ar"
          ? "هذه المجموعة السريرية غير متاحة: لا توجد بيانات منشورة ومتحقق منها للعرض. يمكنك اختيار أمثلة الأدوية الخيالية الموسومة."
          : "Clinical preset unavailable: no verified clinical source data is published here. The invented-drug illustration is explicitly labelled.")
        : (state.lang === "ar" ? "معرّف المجموعة غير معروف." : "Unknown preset identifier.");
      setPresetStatus(message, true);
      $("sample-set").value = state.set;
      return;
    }
    setPresetStatus(state.lang === "ar" ? "جارٍ جلب البيانات العامة والتحقق من بصمتها..." : "Loading the public dataset and verifying its SHA-256 fingerprint...", false);
    try {
      if (!window.crypto || !crypto.subtle) throw new Error("Crypto API requires HTTPS or localhost");
      const response = await fetch(spec.path, { method: "GET", cache: "no-cache", credentials: "omit" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      const bytes = new Uint8Array(await response.arrayBuffer());
      if (bytes.length > 1000000) throw new Error("Preset file too large");
      const digest = Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", bytes)), x => x.toString(16).padStart(2, "0")).join("");
      if (digest !== spec.sha256) throw new Error("SHA-256 mismatch with signed CI artifact");
      const data = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
      if (token !== activePresetRequest) return;
      SAMPLES[name] = data; state.set = name; state.errorCode = null;
      load(state.source === "sample-nokey" ? "sample-nokey" : "sample-key", data);
      if (state.error) throw new Error("Results CSV was rejected by RIDI parser");
      setPresetStatus(state.lang === "ar" ? "تم التحقق من البصمة؛ 48 حالة من التشغيل الموقّع، وليست بيانات سريرية." :
        "SHA-256 verified: 48 cases from the signed run. Not clinical data.", false);
      if (!deepLink) storePresetInUrl(name);
    } catch (error) {
      if (token !== activePresetRequest) return;
      $("sample-set").value = state.set;
      setPresetStatus((state.lang === "ar" ? "تعذّر فتح التجربة: " : "Cannot load signed preset: ") + String(error.message || error), true);
    }
  }
  $("sample-set").addEventListener("change", (ev) => { choosePreset(ev.target.value); });
  $("btn-run").addEventListener("click", () => { state.errorCode = null; load("file", $("paste").value); });
  function readFile(f) {
    activePresetRequest++;
    const rd = new FileReader();
    rd.onload = () => {
      const bytes = new Uint8Array(rd.result); let text = null;
      const enc = bytes[0] === 0xFF && bytes[1] === 0xFE ? "utf-16le" : bytes[0] === 0xFE && bytes[1] === 0xFF ? "utf-16be" : "utf-8";
      try { text = new TextDecoder(enc, { fatal: true }).decode(bytes); } catch (e) { text = null; }
      if (text === null || text.indexOf("\0") >= 0) { state.errorCode = { code: "encoding", info: {} }; render(); return; }
      /* A large file is checked without being copied into the text box, which would double what the page holds. */
      $("paste").value = text.length <= INPUT_LIMIT ? text : "";
      $("paste").placeholder = text.length <= INPUT_LIMIT ? "" : u("tooBig", { n: text.length.toLocaleString("en") });
      state.errorCode = null; load("file", text);
    };
    rd.onerror = () => { state.errorCode = { code: "read", info: {} }; render(); };
    rd.readAsArrayBuffer(f);
  }
  $("file").addEventListener("change", (ev) => { const f = ev.target.files && ev.target.files[0]; if (f) readFile(f); });
  /* the same file can be dropped on the box around the button */
  ["dragenter", "dragover"].forEach((kind) => $("drop").addEventListener(kind, (ev) => { ev.preventDefault(); $("drop").classList.add("over"); }));
  ["dragleave", "dragend"].forEach((kind) => $("drop").addEventListener(kind, () => $("drop").classList.remove("over")));
  $("drop").addEventListener("drop", (ev) => {
    ev.preventDefault(); $("drop").classList.remove("over");
    const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0]; if (f) readFile(f);
  });
  $("mode").addEventListener("change", (ev) => { state.modePref = ev.target.value; if (state.source === "file") { state.errorCode = null; load("file", state.text); } });
  $("sim").addEventListener("change", (ev) => { state.sim = parseFloat(ev.target.value); state.errorCode = null; load(state.source, state.text); });
  $("report").addEventListener("click", (ev) => {
    const b = ev.target.closest("button"); if (!b) return;
    if (b.dataset.filter) { state.filter = b.dataset.filter; state.shown = PAGE; applyFilter(); }
    else if (b.id === "more") { state.shown += PAGE; applyFilter(); }
    else if (b.id === "show-all") { state.shown = Infinity; applyFilter(); }
    else if (b.dataset.judge) {
      const id = state.D.cards[+b.dataset.i].id;
      if (state.judge[id] === b.dataset.judge) delete state.judge[id]; else state.judge[id] = b.dataset.judge;
      store.set(judgeKey(), JSON.stringify(state.judge));
      b.parentElement.querySelectorAll("[data-judge]").forEach((x) => x.setAttribute("aria-pressed", state.judge[id] === x.dataset.judge));
      const line = $("judged"); if (line) line.textContent = judgedText();
    }
    else if (b.dataset.go) {   /* the card may be on a page that is not drawn yet */
      if (state.filter !== "all" || +b.dataset.go >= state.shown) { state.filter = "all"; state.shown = Math.max(state.shown, +b.dataset.go + 1); applyFilter(); }
      const el = $("c-" + b.dataset.go); if (el) el.scrollIntoView({ block: "start" });
    }
    else if (b.id === "copy-j") {
      const ids = state.D.stable_change_ids.filter((id) => state.judge[id]);
      copyOut(RidiCore.toCsv(["case_id", "judgment"], ids.map((id) => [id, state.judge[id]])), b);
    }
    else if (b.id === "copy-r") { const r = RidiCore.reviewTable(state.A, state.judge); copyOut(RidiCore.toCsv(r.header, r.rows), b); }
    else if (b.id === "forget") { state.judge = {}; store.del(judgeKey()); render(); }
  });

  const kept = tab.get();
  if (kept) { $("paste").value = kept; load("file", kept); }
  if (!state.D) { state.errorCode = null; load("sample-key", SAMPLE); }
  // Deep links are allowlisted identifiers, never a user-supplied path or URL.
  const requestedPreset = (typeof URLSearchParams !== "undefined" && typeof location !== "undefined")
    ? new URLSearchParams(location.search).get("preset") : null;
  if (requestedPreset) { choosePreset(requestedPreset, { deepLink: true }); }
})();
</script>
<!--/page-->
</body>
</html>
